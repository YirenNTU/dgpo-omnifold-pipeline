# Original truth-guided DGPO post-training baseline, cold-started from the
# diffusion policy trained on the full Ztautau dataset. This file is merged on
# top of config/train_diffusion_nersc.yaml by scripts/train_neutrino_backend.py.
# It deliberately keeps the original calibration-magnitude reward and does not
# enable OmniFold, adaptive hard trust, signed probes, or extragradient.
#
# Launch after a separate 4-node Ray cluster is ready:
#   shifter python3 scripts/train_neutrino_backend.py \
#     --backend dgpo-evenet \
#     --base-config config/train_diffusion_nersc.yaml \
#     --overlay-config config/dgpo_post_training_overlay.yaml \
#     -- \
#     --ray-dir /pscratch/sd/y/yiren/Ztautau/dgpo_original_fullpretrain_v1/ray_results

nersc:
  ray:
    results_dir: /pscratch/sd/y/yiren/Ztautau/dgpo_original_fullpretrain_v1/ray_results
  execution:
    mode: ray_train_ddp
    workers: 16
    gpus_per_worker: 1
    command: >-
      shifter python3 scripts/train_neutrino_backend.py
      --backend dgpo-evenet
      --base-config config/train_diffusion_nersc.yaml
      --overlay-config config/dgpo_post_training_overlay.yaml
      --
      --ray-dir /pscratch/sd/y/yiren/Ztautau/dgpo_original_fullpretrain_v1/ray_results

platform:
  # Use the same full-data corpus and validation split as supervised diffusion.
  data_parquet_dir: /global/cfs/cdirs/m5019/tihsu/Ztautau/evenet-input/train-diffusion
  data_parquet_val_dir: /global/cfs/cdirs/m5019/tihsu/Ztautau/evenet-input/val-diffusion
  # DGPO expands the effective forward size by K and policy-eval timesteps.
  # Keeping the pretraining batch of 2048 is too large here and tends to OOM.
  batch_size: 256
  number_of_workers: 16
  resources_per_worker: {
    "CPU": 15,
    "GPU": 1,
  }

options:
  Dataset:
    # DGPO post-training uses a smaller train subset and caps validation independently.
    dataset_limit: 0.1
    val_dataset_limit: 50000
  Training:
    # Stage 2: DGPO post-training.
    # Load only policy weights from the full-data supervised checkpoint. DGPO
    # starts at epoch/step zero with fresh optimizer, reference, and EMA state.
    total_epochs: 150
    epochs: 150
    model_checkpoint_load_path: /pscratch/sd/y/yiren/Ztautau/diffusion_pretrain_v1/checkpoints/last.ckpt
    pretrain_model_load_path: null
    model_checkpoint_save_path: /pscratch/sd/y/yiren/Ztautau/dgpo_original_fullpretrain_v1/checkpoints

logger:
  wandb:
    project: nu2flow-RL
    entity: ytchou97-university-of-washington
    run_name: Ztautau-Original-DGPO-FullPretrain-v1
    tags: [NERSC, Ztautau, DGPO, OriginalDGPO, FullDatasetPretrain, CalibrationMagnitudeReward, NoOmniFold, NoAdaptiveTrust, TARP, TargetedPhysics]
  local:
    save_dir: /pscratch/sd/y/yiren/Ztautau/dgpo_original_fullpretrain_v1/logs
    name: Ztautau-Original-DGPO-FullPretrain-v1
    version: v1

rl:
  enabled: true

reward_config:
  type: calibration_magnitude
  weight: 1.0
  feature_names: [theta, phi]
  component_normalized:
    eps: 1.0e-8

ztautau_domain:
  enabled: true
  feature_names: [theta, phi]
  token_sources:
    event_token: event_token
    object_token: object_token
  topology:
    kind: back_to_back
    target_cos_opening: -1.0
    target_delta_phi_to_pi: 0.0

dgpo:
  # This is a fresh DGPO run initialized from a supervised Lightning checkpoint,
  # not a resume of its supervised optimizer/scheduler state.
  checkpoint_load_mode: weights_only
  beta: 1.0
  beta_kl: 5.0e-2
  variance_regularization:
    enabled: false
    weight: 0.0
    features: null
  projection_constraint:
    type: none
  K: 5
  num_ddim_steps: 20
  # Posterior-calibration validation is independent of the training group size.
  validation_K: 16
  validation_num_ddim_steps: 20
  # Cap validation work directly; val_dataset_limit under dgpo is not consumed
  # by the current trainer path.
  validation_compute_winrate: true
  validation_every_n_epochs: 1
  rollout_parallel_chains: 5
  validation_rollout_parallel_chains: 8
  validation_log_batches: true
  checkpoint_every_n_epochs: 5
  ztautau_metrics:
    enabled: true
    # Fixed unbiased draw for truth/current/reference 1D distributions.
    candidate_index: 0
    bins: 60
    log_images: true
  tarp:
    enabled: true
    profile: visible_acoplanarity
    n_bins: 4
    min_events: 500
    arms: [full, rank_copula]
    n_null_assignments: 399
    n_reference_trials: 8
    seed: 20260820
    alpha: 0.05
    pooled_panel: true
  diagnostic_plot_every: 5
  diagnostic_plot_names:
    - ztautau_back_to_back
  diagnostic_bin_ranges:
    theta: [-0.2, 0.2]
    phi: [-0.2, 0.2]
