# NERSC Perlmutter control surface for Ztautau pretrained diffusion training.
#
# This file follows config/train_pretrain.yaml, uses the same 20M.a4 foundation
# checkpoint as EveNet-private, and keeps user-owned outputs in yiren's pscratch
# allocation.  It does not submit or start a NERSC job.  The nersc section is
# metadata for allocation and launch rendering; EveNet ignores unknown
# top-level configuration sections.

nersc:
  submit: false
  system: perlmutter
  account: m5019_g
  qos: regular
  constraint: gpu
  time: "10:00:00"
  nodes: 4
  gpus_per_node: 4
  ntasks_per_node: 1
  cpus_per_task: 128
  image: registry.nersc.gov/m2616/avencast/evenet:1.3
  repo_root: /global/homes/y/yiren/ml_pipeline
  ray:
    start_script: /global/homes/y/yiren/ml_pipeline/NERSC/start_interactive_ray.sh
    temp_dir: /tmp/r${UID}_${SLURM_JOB_ID}
    results_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_pretrain_v1/ray_results
    experimental_noset_cuda_visible_devices: null
  execution:
    mode: ray_train_ddp
    workers: 16
    gpus_per_worker: 1
    command: >-
      shifter python3 evenet_dgpo/evenet/train.py
      config/train_diffusion_nersc.yaml
      --ray_dir /pscratch/sd/y/yiren/Ztautau/diffusion_pretrain_v1/ray_results
  reproducibility:
    dataset_shuffle_seed: 42
    note: >-
      EveNet currently hard-codes the Ray dataset shuffle seed to 42; model and
      diffusion RNG seeding are not yet exposed through the training YAML.

platform:
  # Shared Ztautau diffusion splits on the m5019 CFS project filesystem.
  data_parquet_dir: /global/cfs/cdirs/m5019/tihsu/Ztautau/evenet-input/train-diffusion
  data_parquet_val_dir: /global/cfs/cdirs/m5019/tihsu/Ztautau/evenet-input/val-diffusion
  # One coupled Ray Train/DDP model: 4 nodes x 4 GPUs.
  number_of_workers: 16
  resources_per_worker:
    CPU: 20
    GPU: 1
  batch_size: 2048
  prefetch_batches: 1
  use_gpu: true

logger:
  wandb:
    project: EveNet
    run_name: &logger_name Ztautau-Diffusion-Pretrain-NERSC-v1
    tags: [EveNet, Ztautau, Diffusion, Pretrain, NERSC, Perlmutter, MultiNode]
    entity: ytchou97-university-of-washington
    simplified: false
  local:
    save_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_pretrain_v1/logs
    name: *logger_name
    version: v1

options:
  # The default is vendored so rsyncing ml_pipeline is sufficient.
  default: evenet_defaults/options.yaml

  Training:
    total_epochs: 1500
    epochs: 1500
    model_checkpoint_save_path: /pscratch/sd/y/yiren/Ztautau/diffusion_pretrain_v1/checkpoints
    model_checkpoint_load_path: null
    # Same 20M.a4 cold-start checkpoint used by EveNet-private/TT2L.
    pretrain_model_load_path: /pscratch/sd/y/yiren/checkpoints.20M.a4.last.ckpt
    freeze_modules: []
    diffusion_every_n_epochs: 20
    diffusion_every_n_steps: 1
    eval_metrics_every_n_epochs: 1
    apply_event_weight: false

    learning_rate: &lr 0.0002
    # Match config/train_pretrain.yaml: a 10x smaller LR for the pretrained body.
    learning_rate_body: &lr_body 0.00002
    learning_rate_classification: &lr_classification 0.0002
    learning_rate_median: &lr_median 0.0002

    Components:
      InvisibleInputProjector:
        learning_rate: *lr
        optimizer_group: projector
        optimizer_type: adamW

      GroupedSequentialEmbedding:
        learning_rate: *lr
        optimizer_group: projector
        optimizer_type: adamW
        warm_up: true
        weight_decay: 0.01
        decoupled_weight_decay: true

      GlobalEmbedding:
        learning_rate: *lr
        optimizer_group: body
        optimizer_type: adamW
        warm_up: true

      PET:
        learning_rate: *lr_body
        optimizer_group: body
        optimizer_type: adamW
        warm_up: true

      ObjectEncoder:
        learning_rate: *lr_median
        optimizer_group: object_encoder
        optimizer_type: adamW
        warm_up: true

      Classification:
        learning_rate: *lr_classification
        include: false
        optimizer_type: adamW

      Regression:
        include: false

      Assignment:
        include: false

      Segmentation:
        include: false

      GlobalGeneration:
        include: false

      ReconGeneration:
        include: false

      TruthGeneration:
        include: true
        diffusion_steps: 50
        optimizer_type: adamW
        learning_rate: *lr

    EarlyStopping:
      patience: 1000
      min_delta: 0.0
      monitor: val/loss
      mode: min
      verbose: true

    FAMO:
      turn_on: false
      detailed_loss: false

    EMA:
      enable: true
      decay: 0.999
      start_epoch: 0
      update_every_n_steps: 1
      replace_model_after_load: true
      replace_model_at_end: false

    ProgressiveTraining:
      stages:
        - name: neutrino_only
          epoch_ratio: 1.0
          transition_ratio: 0.0
          loss_weights:
            generation-truth: [1.0, 1.0]

  Dataset:
    dataset_limit: 1.0
    normalization_file: /global/cfs/cdirs/m5019/tihsu/Ztautau/evenet-input/normalization.pt
    val_split: [0.8, 1.0]

  Metrics:
    Generation-Binning:
      # EveNet interprets these as bin edges, so 121 produces 120 bins.
      neutrino-energy: [121, 0, 60]
      neutrino-pt: [121, 0, 60]
      neutrino-eta: [121, -0.15, 0.15]
      neutrino-phi: [121, -0.05, 0.05]
      neutrino-theta: [121, -0.05, 0.05]
    ObjectTag-Embedding:
      enable: true
      group_name: ObjectTag
      label_feature: Part_pdgId
      max_points: 10000
      max_batches: 10
      log_every_n_epochs: 20
      alpha: 0.8
      marker_size: 8.0
      outlier_percentile_low: 0.5
      outlier_percentile_high: 99.5
      others_label: others
      interested_labels:
        "41": pi
        "2": e
        "6": mu
        "21": gamma
        "42": K
        "47": pi0
        "61": K_S0
        "62": K_L0
        "65": p
        "66": n

network:
  default: evenet_defaults/network-20M.yaml

  Body:
    GroupedSequentialEmbedding:
      hidden_dim_scale: 2.0
      dropout: 0.0

    PET:
      feature_drop: 0.0

  TruthGeneration:
    feature_drop: 0.0

event_info:
  # Generate this with generate_event_info_yaml.py before the NERSC launch.
  default: generated_event_info.yaml

resonance:
  default: resonance.yaml
