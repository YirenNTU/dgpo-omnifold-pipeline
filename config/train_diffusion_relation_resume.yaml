    pretrain_model_load_path: null
    model_checkpoint_load_path: null
    resume_latest_checkpoint_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_relation_relations_01/checkpoints
    resume_expected_epoch: 13
    strict_relation_source: false
    epochs: 114
    total_epochs: 114
