# Pure CPU arithmetic on the completed 16-GPU K64 panel. No new inference/job.
source_config: config/conditional_tau_weight_factor_swap.yaml
output_root: /pscratch/sd/y/yiren/Ztautau/conditional_tau_moment_balance
