# Dedicated raw step-1110 supervised fine-tuning pilot.
# Actual peak learning rates, with GPU-count LR scaling disabled.
platform:
  require_filtered_data: true
  # Existing filtered 10% subset: 416701 rows, seven anomalous events removed.
  data_parquet_dir: /pscratch/sd/y/yiren/Ztautau/omnifold_attention_10pct_stic_filtered_test1/train
  # Same validation population, with the two known corrupted events removed.
  data_parquet_val_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_val_20pct_seed42_stic_filtered_test1/val
  number_of_workers: 16
  resources_per_worker:
    CPU: 20
    GPU: 1
  batch_size: 2048
  prefetch_batches: 1
  use_gpu: true

logger:
  wandb:
    project: nu2flow-RL
    run_name: &logger_name "Low-noise fine-tuning | body 2e-5 head 1e-4 | raw step-1110"
    group: Diffusion low-noise coverage
    tags: [Ztautau, Diffusion, FineTune, LowNoise, RawWeights, Data10pct, GPU16]
    entity: ytchou97-university-of-washington
    simplified: false
  local:
    save_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_low_noise_lr_10pct_seed42/logs
    name: *logger_name
    version: v1

options:
  default: evenet_defaults/options.yaml

  Training:
    total_epochs: 250
    seed: 42
    scale_lr_with_world_size: false
    epochs: 250
    model_checkpoint_save_path: /pscratch/sd/y/yiren/Ztautau/diffusion_low_noise_lr_10pct_seed42/checkpoints
    model_checkpoint_load_path: null
    # Load raw weights only; fresh optimizer and scheduler.
    pretrain_model_load_path: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_10pct_old_method_hard_nc4shnpg_t075_trust1_nohardtrust_seed42/checkpoints/dgpo-epoch=110-next_ep=111-step=1110.ckpt
    freeze_modules: []
    diffusion_every_n_epochs: 5
    diffusion_every_n_steps: 1
    eval_metrics_every_n_epochs: 1
    apply_event_weight: false
    JointCoverage:
      enable: true
      every_n_epochs: 25
      panel_path: /pscratch/sd/y/yiren/Ztautau/h4_spike_coverage_1110/panel.pt
      events: 1024
      K: 32
      batch_size: 16
      ddim_steps: 20
      x0_mode: legacy
      seed: 42017
      bootstrap: 500

    learning_rate: &lr 0.0001
    learning_rate_body: &lr_body 0.00002
    learning_rate_classification: &lr_classification 0.0002
    learning_rate_median: &lr_median 0.00002

    Components:
      InvisibleInputProjector:
        learning_rate: *lr
        optimizer_group: projector
        optimizer_type: adamW

      GroupedSequentialEmbedding:
        learning_rate: *lr
        optimizer_group: projector
        optimizer_type: adamW
        warm_up: true
        weight_decay: 0.01
        decoupled_weight_decay: true

      GlobalEmbedding:
        learning_rate: *lr_body
        optimizer_group: body
        optimizer_type: adamW
        warm_up: true

      PET:
        learning_rate: *lr_body
        optimizer_group: body
        optimizer_type: adamW
        warm_up: true

      ObjectEncoder:
        learning_rate: *lr_median
        optimizer_group: object_encoder
        optimizer_type: adamW
        warm_up: true

      Classification:
        learning_rate: *lr_classification
        include: false
        optimizer_type: adamW

      Regression:
        include: false

      Assignment:
        include: false

      Segmentation:
        include: false

      GlobalGeneration:
        include: false

      ReconGeneration:
        include: false

      TruthGeneration:
        include: true
        low_noise_cutoff: 0.1
        low_noise_weight: 4.0
        diffusion_steps: 50
        optimizer_type: adamW
        learning_rate: *lr

    EarlyStopping:
      # Fixed pilot budget; do not stop early on fluctuating weighted val loss.
      patience: 250
      min_delta: 0.0
      monitor: val/loss
      mode: min
      verbose: true

    FAMO:
      turn_on: false
      detailed_loss: false

    EMA:
      enable: false
      decay: 0.999
      start_epoch: 0
      update_every_n_steps: 1
      replace_model_after_load: false
      replace_model_at_end: false
      use_for_generation: false

    ProgressiveTraining:
      stages:
        - name: neutrino_only
          epoch_ratio: 1.0
          transition_ratio: 0.0
          loss_weights:
            generation-truth: [1.0, 1.0]

  Dataset:
    # The directory is already the fixed 10% population. A second 0.05 limit
    # would accidentally train on only 0.210% of the original data.
    dataset_limit: 1.0
    dataset_limit_apply_to_val_set: false
    # The validation directory is already the fixed 20% population. A second
    # 0.2 limit would accidentally retain only 4% of canonical validation.
    val_dataset_limit: 1.0
    normalization_file: /global/cfs/cdirs/m5019/tihsu/Ztautau/evenet-input/normalization.pt
    val_split: [0.8, 1.0]

  Metrics:
    Generation-Binning:
      neutrino-energy: [121, 0, 60]
      neutrino-pt: [121, 0, 60]
      neutrino-eta: [121, -0.15, 0.15]
      neutrino-phi: [121, -0.05, 0.05]
      neutrino-theta: [121, -0.05, 0.05]
    ObjectTag-Embedding:
      enable: false
      group_name: ObjectTag
      label_feature: Part_pdgId
      max_points: 10000
      max_batches: 10
      log_every_n_epochs: 20
      alpha: 0.8
      marker_size: 8.0
      outlier_percentile_low: 0.5
      outlier_percentile_high: 99.5
      others_label: others
      interested_labels:
        "41": pi
        "2": e
        "6": mu
        "21": gamma
        "42": K
        "47": pi0
        "61": K_S0
        "62": K_L0
        "65": p
        "66": n

network:
  default: evenet_defaults/network-20M.yaml

  Body:
    GroupedSequentialEmbedding:
      hidden_dim_scale: 2.0
      dropout: 0.0

    PET:
      feature_drop: 0.0

  TruthGeneration:
    feature_drop: 0.0

event_info:
  default: generated_event_info.yaml

resonance:
  default: resonance.yaml
