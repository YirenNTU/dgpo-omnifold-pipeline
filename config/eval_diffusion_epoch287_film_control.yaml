experiment:
  question: Does visible FiLM improve supervised tau spin closure on filtered 10%
    training data?
  intervention: global_visible_film_only_at_original_generation_depth
  source_stage: original_20M_a4_foundation_before_ztautau_diffusion
  checkpoint_protocol: foundation_weights_only_fresh_optimizer_scheduler_epoch_zero
  primary_endpoint: generated_Cij_Frobenius_error_at_fixed_completed_epoch_200
  physics_guardrail: nn_absolute_error_at_the_same_epoch
  secondary: validation_velocity_loss_and_all_Cij_components
  evaluation_epochs:
  - 0
  - 50
  - 100
  - 150
  - 200
  interpretation: FiLM-on pilot only; no matched off-arm training is launched. Retain
    original one-block depth, filtered populations, normalization file, supervised
    loss, batch2048 per GPU and historical optimizer/schedule. Added FiLM starts with
    zero scale/shift and uses visible inputs only. Fourier channels are disabled.
    Ordered batches and paired training/validation RNG support a future matched control;
    the historical off run is descriptive, not a matched causal control. Training
    may continue to1500 epochs or stop on inherited val/loss patience25. If it stops
    before200, the declared endpoint is incomplete. Cij uses the existing fixed-energy
    tau reconstruction and analyzing-power convention; this is not complete tau-rest-frame
    or entanglement closure.
  film: 'on'
  source_checkpoint: /pscratch/sd/y/yiren/checkpoints.20M.a4.last.ckpt
  source_epoch: 29
  source_global_step: 109650
  source_normalization_file: /global/cfs/cdirs/m5019/tihsu/Ztautau/evenet-input/normalization.pt
