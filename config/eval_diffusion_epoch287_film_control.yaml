# Exact original pretrain epoch287 architecture; no MET/two-leg adapter migration.
# Keep diffusion_enabled: true so every learned FiLM weight is loaded.
# Edit network.VisibleConditioning.diffusion_film_gains below.
nersc:
  submit: false
  system: perlmutter
  account: m5019_g
  qos: regular
  constraint: gpu
  time: '10:00:00'
  nodes: 1
  gpus_per_node: 4
  ntasks_per_node: 1
  cpus_per_task: 128
  image: registry.nersc.gov/m2616/avencast/evenet:1.3
  repo_root: /global/homes/y/yiren/ml_pipeline
  ray:
    start_script: /global/homes/y/yiren/ml_pipeline/NERSC/start_interactive_ray.sh
    temp_dir: /tmp/r${UID}_${SLURM_JOB_ID}
    results_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_film_10pct_foundation/film-on-run-02/ray_results
    experimental_noset_cuda_visible_devices: null
  execution:
    mode: ray_train_ddp
    workers: 4
    gpus_per_worker: 1
    command: shifter python3 -u scripts/check_tau_epoch287_film_control.py config/eval_diffusion_epoch287_film_control.yaml
  reproducibility:
    dataset_shuffle_seed: 42
    note: Training identities are materialized once with a NumPy seed-42 row-level
      sample. Ray may reshuffle their order without changing subset membership.
    subset_config:
      train: config/subset_ztautau_diffusion_10pct.yaml
      validation: config/subset_ztautau_validation_20pct.yaml
platform:
  data_parquet_dir: /pscratch/sd/y/yiren/Ztautau/omnifold_attention_10pct_stic_filtered_test1/train
  data_parquet_val_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_val_20pct_seed42_stic_filtered_test1/val
  number_of_workers: 4
  resources_per_worker:
    CPU: 20
    GPU: 1
  batch_size: 2048
  prefetch_batches: 1
  use_gpu: true
  require_filtered_data: true
  ordered_data: true
logger:
  wandb:
    project: nu2flow-RL
    run_name: Original epoch287 | FiLM config control | evaluation only
    tags:
    - DiffusionOnly
    - NoRL
    - Foundation
    - GlobalFiLM
    - NoFourier
    - Depth1
    - FilteredData
    - Data10pct
    - GPU16
    - RawWeights
    entity: ytchou97-university-of-washington
    simplified: false
    id: null
    group: Diffusion foundation FiLM
    mode: disabled
  local:
    save_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_film_10pct_foundation/film-on-run-02/logs
    name: diffusion-film-10pct-foundation
    version: v1
options:
  Training:
    total_epochs: 1500
    epochs: 1500
    model_checkpoint_save_top_k: 5
    model_checkpoint_save_path: /pscratch/sd/y/yiren/Ztautau/diffusion_film_10pct_foundation/film-on-run-02/checkpoints
    model_checkpoint_load_path: null
    pretrain_model_load_path: null
    learning_rate: 0.0002
    learning_rate_factor: 1.0
    learning_rate_warm_up_factor: 1.0
    weight_decay: 0.001
    decoupled_weight_decay: true
    diffusion_every_n_epochs: 20
    diffusion_every_n_steps: 1
    eval_metrics_every_n_epochs: 1
    apply_event_weight: false
    log_gradient_step: 100
    Components:
      GlobalEmbedding:
        learning_rate: 0.0002
        optimizer_group: body
        optimizer_type: adamW
        warm_up: true
        weight_decay: 0.001
        decoupled_weight_decay: true
        freeze:
          type: none
          partial_freeze_components: []
          random_freeze_fraction: 0.0
      PET:
        learning_rate: 2.0e-05
        optimizer_group: body
        optimizer_type: adamW
        warm_up: true
        weight_decay: 0.001
        decoupled_weight_decay: true
        freeze:
          type: none
          partial_freeze_components: []
          random_freeze_fraction: 0.0
      ObjectEncoder:
        learning_rate: 0.0002
        optimizer_group: object_encoder
        optimizer_type: adamW
        warm_up: true
        weight_decay: 0.001
        decoupled_weight_decay: true
        freeze:
          type: none
          partial_freeze_components: []
          random_freeze_fraction: 0.0
      Classification:
        learning_rate: 0.0002
        optimizer_group: classification
        optimizer_type: adamW
        warm_up: true
        loss_scale: 1.0
        include: false
        include_cross_term: true
        loss_scale_cross_term: 1.0
        weight_decay: 0.001
        decoupled_weight_decay: true
        freeze:
          type: none
          partial_freeze_components: []
          random_freeze_fraction: 0.0
      Regression:
        learning_rate: 5.0e-05
        optimizer_group: regression
        optimizer_type: lion
        warm_up: true
        loss_scale: 1.0
        include: false
        weight_decay: 0.001
        decoupled_weight_decay: true
        freeze:
          type: none
          partial_freeze_components: []
          random_freeze_fraction: 0.0
      Assignment:
        learning_rate: 5.0e-05
        optimizer_group: assignment
        optimizer_type: lion
        warm_up: true
        assignment_loss_scale: 1.0
        detection_loss_scale: 1.0
        focal_gamma: 1.0
        include: false
        weight_decay: 0.001
        decoupled_weight_decay: true
        freeze:
          type: none
          partial_freeze_components: []
          random_freeze_fraction: 0.0
      Segmentation:
        learning_rate: 5.0e-05
        optimizer_group: segmentation
        optimizer_type: lion
        warm_up: true
        include: false
        mask_loss_scale: 1.0
        dice_loss_scale: 1.0
        cls_loss_scale: 1.0
        weight_decay: 0.001
        decoupled_weight_decay: true
        use_full_mask: true
        freeze:
          type: none
          partial_freeze_components: []
          random_freeze_fraction: 0.0
      GlobalGeneration:
        learning_rate: 5.0e-05
        optimizer_group: generation
        optimizer_type: lion
        warm_up: true
        include: false
        loss_scale: 1.0
        weight_decay: 0.001
        decoupled_weight_decay: true
        diffusion_steps: 20
        freeze:
          type: none
          partial_freeze_components: []
          random_freeze_fraction: 0.0
      ReconGeneration:
        learning_rate: 5.0e-05
        optimizer_group: generation
        optimizer_type: lion
        warm_up: true
        include: false
        loss_scale: 1.0
        weight_decay: 0.001
        decoupled_weight_decay: true
        diffusion_steps: 100
        freeze:
          type: none
          partial_freeze_components: []
          random_freeze_fraction: 0.0
        use_generation_result: false
      TruthGeneration:
        learning_rate: 0.0002
        optimizer_group: generation
        optimizer_type: adamW
        warm_up: true
        include: true
        loss_scale: 1.0
        weight_decay: 0.001
        decoupled_weight_decay: true
        diffusion_steps: 50
        freeze:
          type: none
          partial_freeze_components: []
          random_freeze_fraction: 0.0
        low_noise_cutoff: 0.0
        low_noise_weight: 1.0
      InvisibleInputProjector:
        learning_rate: 0.0002
        optimizer_group: projector
        optimizer_type: adamW
      GroupedSequentialEmbedding:
        learning_rate: 0.0002
        optimizer_group: projector
        optimizer_type: adamW
        warm_up: true
        weight_decay: 0.01
        decoupled_weight_decay: true
      TruthGeneration.visible_conditioning:
        optimizer_group: visible_conditioning
        optimizer_type: adamW
        learning_rate: 0.0002
        warm_up: true
        weight_decay: 0.001
        decoupled_weight_decay: true
    ProgressiveTraining:
      stages:
      - name: neutrino_only
        epoch_ratio: 1.0
        transition_ratio: 0.0
        loss_weights:
          generation-truth:
          - 1.0
          - 1.0
    EarlyStopping:
      patience: 25
      min_delta: 0.0
      monitor: val/loss
      mode: min
      verbose: true
    FAMO:
      turn_on: false
      detailed_loss: false
      detailed_loss_list:
      - classification
      - classification-noised
      - generation-global
      - generation-event
      - generation-invisible
      - assignment
      - detection
      - regression
      - segmentation
      logits_bound: 1.0
      lr: 0.025
    EMA:
      enable: false
      decay: 0.999
      start_epoch: 0
      update_every_n_steps: 1
      replace_model_after_load: false
      replace_model_at_end: false
      use_ema_during_training_eval: false
      use_for_generation: false
    freeze_modules: []
    learning_rate_body: 2.0e-05
    learning_rate_classification: 0.0002
    learning_rate_median: 0.0002
    precision: 32-true
    seed: 42
    paired_diffusion_seed: 20261006
    model_checkpoint_save_last: true
    scale_lr_with_world_size: true
    JointCoverage:
      enable: false
    TauPhysics:
      enable: true
      events: 119002
      every_n_epochs: 50
      K: 8
      batch_size: 512
      ddim_steps: 20
      seed: 20261006
      bootstrap: 300
      panel_path: /pscratch/sd/y/yiren/Ztautau/diffusion_film_10pct_foundation/film-on-run-02/validation_panel.npz
      panel_metadata: /pscratch/sd/y/yiren/Ztautau/diffusion_film_10pct_foundation/film-on-run-02/validation_panel.json
  Dataset:
    dataset_limit: 1.0
    normalization_file: /pscratch/sd/y/yiren/Ztautau/tau_dgpo_spin_angles/within-event-reward-epoch287-refit10-val5-run-02/normalization.pt
    balance_file: null
    dataset_limit_apply_to_val_set: false
    val_split:
    - 0.8
    - 1.0
    val_dataset_limit: 1.0
  Metrics:
