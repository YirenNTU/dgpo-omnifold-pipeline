      num_vectors:
      - 21
      - -1
      - 20
      point cloud-log_energy:
      - 50
      - -1
      - 10
      point cloud-log_pt:
      - 50
      - -1
      - 10
      point cloud-eta:
      - 50
      - -4
      - 4
      point cloud-phi:
      - 50
      - -4
      - 4
      point cloud-btag:
      - 2
      - 0
      - 1
      point cloud-isLepton:
      - 2
      - 0
      - 1
      point cloud-charge:
      - 3
      - -1
      - 1
      neutrino-log_mass:
      - 10
      - -1
      - 1
      neutrino-log_pt:
      - 50
      - 0
      - 7
      neutrino-eta:
      - 121
      - -0.15
      - 0.15
      neutrino-phi:
      - 121
      - -0.05
      - 0.05
      neutrino-btag:
      - 2
      - 0
      - 1
      neutrino-isLepton:
      - 2
      - 0
      - 1
      neutrino-charge:
      - 3
      - -1
      - 1
      neutrino-energy:
