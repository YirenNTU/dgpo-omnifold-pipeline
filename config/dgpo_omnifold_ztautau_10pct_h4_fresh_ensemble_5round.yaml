# Five-round classifier-to-DGPO pilot from c4a91e07/last.ckpt.
# Launch through scripts/train_dgpo_h4_fresh_ensemble_pilot.py: it reads the
# completed epsilon-sweep report and replaces the placeholder policy LR and
# v5 temperature scale before starting Ray Train.
extends_overlay: dgpo_omnifold_ztautau_10pct_old_method_hard_dropout015.yaml

experiment:
  protocol: h4-fresh-ensemble-5round-v1
  epsilon_sweep_report: /pscratch/sd/y/yiren/Ztautau/c4a91e07_h4_epsilon_sweep_v1/report.json
  expected_epsilon_schema: c4a91e07-h4-calibrated-loo-epsilon-sweep-v1
  rounds: 5
  policy_updates_per_round: 10
  ensemble_seeds: 2
  crossfit_folds: 2
  endpoint_selection: fixed_step_50
  trajectory_metrics_are_selection_blind: true
  wandb_required: true
  epsilon_selection:
    mode: stable_distribution_signal
    minimum_gradient_cosine: 0.99
  primary_physics_targets:
    - val_ztautau/jsd/current/topology/delta_phi_to_pi
    - val_ztautau/jsd/current/topology/cos_opening
    - val_ztautau/jsd/current/topology/back_to_back_loss
    - val_ztautau/jsd/current/topology/calibration_deltaR_sum
    - val_ztautau/residual/current/target/tau_a_delta_theta/abs_mean
    - val_ztautau/residual/current/target/tau_a_delta_phi/abs_mean
    - val_ztautau/residual/current/target/tau_b_delta_theta/abs_mean
    - val_ztautau/residual/current/target/tau_b_delta_phi/abs_mean

nersc:
  reproducibility:
    source_wandb_run: ytchou97-university-of-washington/nu2flow-RL/c4a91e07
    source_dgpo_global_step: 1110
    note: >-
      Fixed 50-update endpoint. Five fresh H4 reward ensembles; each ensemble is
      two independent cross-fit repeats times two folds. Bootstrap is round 1,
      then a scheduled fresh reward is installed every 10 accepted DGPO updates.
      No classifier weights or AdamW state cross a reward round. The v5 scalar
      calibration scale and policy LR are injected from the preceding paired
      epsilon sweep. No hard trust boundary, rollback, early checkpoint choice,
      or metric-based stopping. Validation and fresh raw audits are trajectory
      monitors; step 50 is the predeclared endpoint.
  ray:
    # retry1 avoids mixing Ray Tune state with the pre-bootstrap config failure.
    results_dir: /pscratch/sd/y/yiren/Ztautau/c4a91e07_h4_fresh_ensemble_5round_v1/ray_results_retry1
  execution:
    mode: ray_train_ddp
    workers: 16
    gpus_per_worker: 1
    command: >-
      shifter python3 scripts/train_dgpo_h4_fresh_ensemble_pilot.py
      --config config/dgpo_omnifold_ztautau_10pct_h4_fresh_ensemble_5round.yaml

logger:
  wandb:
    # The critical profile skips construction of response matrices. Standard
    # plus simplified keeps physics/response panels without generic train clutter.
    profile: standard
    classifier_loss_curves: true
    simplified: true
    resume: allow
    fresh_run: false
    id: h4fr5r01
    project: nu2flow-RL
    entity: ytchou97-university-of-washington
    run_name: c4a91e07_h4_fresh_ensemble_5round_v1
    tags:
      - NERSC
      - Ztautau
      - DGPO
      - SourceC4a91e07Last
      - Fixed50StepEndpoint
      - FiveRewardRounds
      - TenUpdatesPerRound
      - H4NonlinearFourier
      - TwoSeedsTwoFolds
      - FreshClassifierEveryRound
      - FreshClassifierOptimizer
      - FreshPolicyOptimizerEveryRound
      - V5TemperatureScale
      - EpsilonSelectedPolicyLR
      - StableDistributionSignalSelection
      - LocalResponseTradeoffObserved
      - NoHardTrust
      - NoRollback
      - LiveWandb

options:
  Training:
    total_epochs: 5
    epochs: 5
    # Placeholder only. The launcher overwrites every policy optimizer group
    # with selected_epsilon_rms (PET uses 0.1x) and saves the resolved overlay.
    learning_rate: 1.0e-6
    learning_rate_body: 1.0e-7
    learning_rate_warm_up_factor: 0.1
    model_checkpoint_load_path: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_10pct_old_method_hard_nc4shnpg_t075_trust1_nohardtrust_seed42/checkpoints/last.ckpt
    model_checkpoint_save_path: /pscratch/sd/y/yiren/Ztautau/c4a91e07_h4_fresh_ensemble_5round_v1/checkpoints
    model_checkpoint_save_top_k: 0
    Components:
      InvisibleInputProjector:
        learning_rate: 1.0e-6
        warm_up: false
      GroupedSequentialEmbedding:
        learning_rate: 1.0e-6
        warm_up: false
      GlobalEmbedding:
        learning_rate: 1.0e-6
        warm_up: false
      PET:
        learning_rate: 1.0e-7
        warm_up: false
      TruthGeneration:
        learning_rate: 1.0e-6
        warm_up: false
    EMA:
      replace_model_after_load: false
      use_for_generation: false
      use_ema_during_training_eval: false

