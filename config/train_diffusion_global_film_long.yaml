# Matched control for the full-finetuning velocity residual arm.
extends_overlay: train_diffusion_velocity_residual_joint.yaml

network:
  VisibleConditioning:
    diffusion_token_readout:
      enabled: false

options:
  Training:
    model_checkpoint_save_path: /pscratch/sd/y/yiren/Ztautau/diffusion_global_film_long/checkpoints

logger:
  local:
    name: diffusion-global-film-long
    save_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_global_film_long/logs
  wandb:
    id: diffgloblong1
    run_name: "Does output residual help? | global FiLM control | validation stopping"
    tags: [DiffusionOnly, FullFinetuning, GlobalFiLM, RawWeights, Data10pct, GPU16, PairedNoise]

nersc:
  ray:
    results_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_global_film_long/ray_results
  execution:
    command: >-
      shifter --image=registry.nersc.gov/m2616/avencast/evenet:1.3
      python3 -u scripts/train_neutrino_backend.py --backend pure-evenet
      --base-config config/train_diffusion_nersc.yaml
      --overlay-config config/train_diffusion_global_film_long.yaml
      -- --ray_dir /pscratch/sd/y/yiren/Ztautau/diffusion_global_film_long/ray_results

experiment:
  question: Does output velocity residual improve over global FiLM under the same long training setup?
  intervention: global_film_without_output_velocity_residual
  matched_configuration: config/train_diffusion_velocity_residual_joint.yaml
  interpretation: >-
    Matched global-FiLM control for diffveljoint1. Load identical raw step-zero
    policy weights with fresh optimizer and scheduler. Disable only the additional
    output token readout; retain existing PET Fourier and global conditioning.
    Same data, seed, paired noise, trainable backbone,16 GPUs,2048 events per GPU,
    component learning rates, five-epoch warmup,1000-epoch cosine to10pct floor,
    unlimited maximum epochs and validation patience200. Compare aligned epochs
    and low/mid/high-noise validation MSE as well as overall loss.
