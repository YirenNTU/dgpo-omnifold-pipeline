# Controlled fresh ablation: warm-start policy weights from the stable first
# B=512 pure-diffusion DGPO checkpoint, then rebuild all DGPO/OmniFold state.
# Launch after the 4-node Ray cluster is up:
#   shifter python3 evenet_dgpo/RL/DGPO_neutrino/dgpo_trainer.py \
#     config/dgpo_omnifold_ztautau_purediff_ablation.yaml \
#     --ray-dir /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_ablation_purediff_warmstart_b512_v2/ray_results
#
# This is the materialized base+DGPO configuration. Diffusion pretraining
# continues to use config/train_diffusion_nersc.yaml independently.
nersc:
  submit: false
  system: perlmutter
  account: m5019_g
  qos: regular
  constraint: gpu
  time: '10:00:00'
  nodes: 4
  gpus_per_node: 4
  ntasks_per_node: 1
  cpus_per_task: 128
  image: registry.nersc.gov/m2616/avencast/evenet:1.3
  repo_root: /global/homes/y/yiren/ml_pipeline
  ray:
    start_script: /global/homes/y/yiren/ml_pipeline/NERSC/start_interactive_ray.sh
    temp_dir: /tmp/r${UID}_${SLURM_JOB_ID}
    results_dir: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_ablation_purediff_warmstart_b512_v2/ray_results
    experimental_noset_cuda_visible_devices: null
  execution:
    mode: ray_train_ddp
    workers: 16
    gpus_per_worker: 1
    command: shifter python3 evenet_dgpo/RL/DGPO_neutrino/dgpo_trainer.py config/dgpo_omnifold_ztautau_purediff_ablation.yaml
      --ray-dir /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_ablation_purediff_warmstart_b512_v2/ray_results
  reproducibility:
    dataset_shuffle_seed: 42
    note: EveNet currently hard-codes the Ray dataset shuffle seed to 42; model and
      diffusion RNG seeding are not yet exposed through the training YAML.
platform:
  data_parquet_dir: /pscratch/sd/y/yiren/Ztautau/dgpo_post_training_40pct/train
  data_parquet_val_dir: /global/cfs/cdirs/m5019/tihsu/Ztautau/evenet-input/val-diffusion
  number_of_workers: 16
  resources_per_worker:
    CPU: 20
    GPU: 1
  batch_size: 512
  prefetch_batches: 1
  use_gpu: true
logger:
  wandb:
    project: nu2flow-RL
    run_name: Ztautau-DGPO-ablation-purediff-warmstart-b512-v2-crossfit2-audit600k
    tags:
    - NERSC
    - Ztautau
    - DGPO
    - OmniFoldReward
    - TARP
    - TargetedPhysics
    - Ablation
    - PureDiffusionInit
    - WarmStartB512
    entity: ytchou97-university-of-washington
    simplified: true
  local:
    save_dir: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_ablation_purediff_warmstart_b512_v2/logs
    name: EveNet-OmniFold-DGPO-ablation-purediff-warmstart-b512-v2-audit600k-pool1200k-crossfit2
    version: v1
options:
  default: evenet_defaults/options.yaml
  Training:
    total_epochs: 1500
    epochs: 1500
    # Keep every periodic snapshot; no metric-ranked top-k pruning is applied.
    model_checkpoint_save_top_k: 0
    # Resume and continue writing snapshots in the same independent run directory.
    model_checkpoint_save_path: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_ablation_purediff_warmstart_b512_v2/checkpoints
    # True resume from the newest snapshot, including optimizer, epoch,
    # policy references, installed OmniFold stack, and certified baseline.
    model_checkpoint_load_path: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_ablation_purediff_warmstart_b512_v2/checkpoints/last.ckpt
    pretrain_model_load_path: null
    freeze_modules: []
    diffusion_every_n_epochs: 20
    diffusion_every_n_steps: 1
    eval_metrics_every_n_epochs: 1
    apply_event_weight: false
    learning_rate: 0.0001
    learning_rate_body: 1.0e-05
    learning_rate_classification: 0.0002
    learning_rate_median: 0.0002
    Components:
      InvisibleInputProjector:
        learning_rate: 0.0001
        optimizer_group: projector
        optimizer_type: adamW
      GroupedSequentialEmbedding:
        learning_rate: 0.0001
        optimizer_group: projector
        optimizer_type: adamW
        warm_up: true
        weight_decay: 0.01
        decoupled_weight_decay: true
      GlobalEmbedding:
        learning_rate: 1.0e-05
        optimizer_group: body
        optimizer_type: adamW
        warm_up: true
      PET:
        learning_rate: 1.0e-05
        optimizer_group: body
        optimizer_type: adamW
        warm_up: true
      ObjectEncoder:
        learning_rate: 1.0e-05
        optimizer_group: object_encoder
        optimizer_type: adamW
        warm_up: true
      Classification:
        learning_rate: 0.0002
        include: false
        optimizer_type: adamW
      Regression:
        include: false
      Assignment:
        include: false
      Segmentation:
        include: false
      GlobalGeneration:
        include: false
      ReconGeneration:
        include: false
      TruthGeneration:
        include: true
        diffusion_steps: 50
        optimizer_type: adamW
        learning_rate: 0.0001
        optimizer_group: truth_generation
    EarlyStopping:
      patience: 1000
      min_delta: 0.0
      monitor: val/loss
      mode: min
      verbose: true
    FAMO:
      turn_on: false
      detailed_loss: false
    EMA:
      enable: true
      decay: 0.999
      start_epoch: 0
      update_every_n_steps: 1
      replace_model_after_load: true
      replace_model_at_end: false
      use_for_generation: false
    ProgressiveTraining:
      stages:
      - name: neutrino_only
        epoch_ratio: 1.0
        transition_ratio: 0.0
        loss_weights:
          generation-truth:
          - 1.0
          - 1.0
  Dataset:
    dataset_limit: 1.0
    normalization_file: /global/cfs/cdirs/m5019/tihsu/Ztautau/evenet-input/normalization.pt
    val_split:
    - 0.8
    - 1.0
    # Strong-only audit needs a real 600k population. Full DGPO validation still
    # obeys validation_max_batches, while OmniFold acceptance remains capped at 300k.
    val_dataset_limit: 600000
  Metrics:
    Generation-Binning:
      neutrino-energy:
      - 121
      - 0
      - 60
      neutrino-pt:
      - 121
      - 0
      - 60
      neutrino-eta:
      - 121
      - -0.15
      - 0.15
      neutrino-phi:
      - 121
      - -0.05
      - 0.05
      neutrino-theta:
      - 121
      - -0.05
      - 0.05
    ObjectTag-Embedding:
      enable: true
      group_name: ObjectTag
      label_feature: Part_pdgId
      max_points: 10000
      max_batches: 10
      log_every_n_epochs: 20
      alpha: 0.8
      marker_size: 8.0
      outlier_percentile_low: 0.5
      outlier_percentile_high: 99.5
      others_label: others
      interested_labels:
        '41': pi
        '2': e
        '6': mu
        '21': gamma
        '42': K
        '47': pi0
        '61': K_S0
        '62': K_L0
        '65': p
        '66': n
network:
  default: evenet_defaults/network-20M.yaml
  Body:
    GroupedSequentialEmbedding:
      hidden_dim_scale: 2.0
      dropout: 0.0
    PET:
      feature_drop: 0.0
  TruthGeneration:
    feature_drop: 0.0
event_info:
  default: generated_event_info.yaml
resonance:
  default: resonance.yaml
rl:
  enabled: true
reward_config:
  type: omnifold
  weight: 1.0
  omnifold:
    bootstrap_in_dgpo: true
    bundle_file: null
    backbone_checkpoint: /pscratch/sd/y/yiren/Ztautau/diffusion_pretrain_v1/checkpoints/last.ckpt
    # Share one frozen EveNet classifier body and fit only its PEFT bank.
ztautau_domain:
  enabled: true
  feature_names:
  - theta
  - phi
dgpo:
  # Restore the complete DGPO state. An installed checkpointed OmniFold stack
  # skips the initial bootstrap and keeps its certified baseline.
  checkpoint_load_mode: resume
  # Match EveNet pretraining: faster tensor-core matmuls with float32 I/O.
  float32_matmul_precision: medium
  advantage_estimator: leave_one_out_unscaled
  K: 8
  beta: 1.0
  beta_kl: 0.0
  reference_trust:
    enabled: true
    coefficient: 1.0
  num_ddim_steps: 20
  # Recompute the 16 PET transformer blocks during backward instead of retaining
  # all intermediate activations for the K*B current-policy forward.
  activation_checkpointing: true
  validation_K: 16
  # Cheap monitoring stays frequent but only evaluates current-policy reward
  # scalars on 2 batches/rank. It does not run the reference policy, plots, or TARP.
  validation_cheap_K: 8
  validation_cheap_max_batches: 2
  validation_cheap_log_batches: false
  validation_num_ddim_steps: 20
  # Rollout is forward-only/no-grad, so evaluate all K=8 chains together.
  # Gradient-bearing policy evaluation remains independently capped at 256 events.
  rollout_parallel_chains: 8
  validation_rollout_parallel_chains: 8
  # Validation uses the same stable per-rank event batch as DGPO training.
  validation_batch_size: 512
  num_train_timesteps: 8
  # Keep the full B=512 DGPO objective and one AdamW update, but evaluate the
  # gradient-bearing policy in two 256-event chunks to bound activation memory.
  policy_eval_event_microbatch_size: 256
  policy_eval_parallel_timesteps: 1
  # Save a distinct checkpoint every five logical epochs. last.ckpt points to
  # the newest snapshot. Audit/refit and final boundaries also save.
  checkpoint_every_n_steps: 0
  checkpoint_every_n_epochs: 5
  # Short logical epochs do not restart the Ray iterator. With 16 workers and
  # batch_size=512, one 1.6M-event data pass is about 196 optimizer steps, or
  # about 20 logical epochs.
  steps_per_epoch: 10
  adv_clip_max: null
  grad_clip_norm: 1.0
  policy_eval_t_min: 0.0
  policy_eval_t_max: 0.7
  ema_rollout_decay_max: 0.3
  ema_rollout_decay_ramp: 0.001
  log_every: 1
  # Full K=16 + reference + compact Ztautau/TARP diagnostics every 10 logical epochs.
  # The cheap and full cadences coincide, so the full pass replaces the cheap
  # pass and validation runs exactly once every 10 epochs.
  validation_every_n_epochs: 10
  validation_full_every_n_epochs: 10
  validation_compute_winrate: true
  validation_log_batches: true
  validation_max_batches: 13
  diagnostic_plots:
    enabled: false
  # Full validation already covers the same distributions. Disable duplicate
  # train_dist arrays, cross-rank gathers, and plots in the compact W&B profile.
  train_dist_enabled: false
  ztautau_metrics:
    enabled: true
    candidate_index: 0
    bins: 60
    log_images: true
  tarp:
    enabled: true
    profile: visible_acoplanarity
    n_bins: 4
    min_events: 500
    arms:
    - full
    - rank_copula
    n_null_assignments: 399
    n_reference_trials: 8
    seed: 20260820
    alpha: 0.05
    pooled_panel: true
  adaptive_omnifold:
    enabled: true
    log_only: false
    baseline_probe_on_start: true
    # No-grad K=1 DDIM population generation only. Independent of the DGPO
    # policy batch (1024) and classifier effective global batch (131072/class).
    pool_generation_batch_size: 1024
    # Fresh adapter staleness audit every 100 optimizer steps: 10 DGPO logical
    # epochs. Incumbent/candidate acceptance audits remain event-driven and run
    # only after a staleness audit triggers a reward refit.
    staleness_every_n_epochs: 10
    trigger:
      # Fixed installed-round controller: retrain when the current weighted
      # |AUC-0.5| exceeds the certified round baseline by the tunable 0.01
      # AUC-gap margin. This is the sole retraining threshold hyperparameter.
      retrain_auc_margin: 0.01
      required_consecutive_epochs: 1
      # A threshold crossing may stop a routine audit immediately; a healthy
      # decision and every candidate acceptance still require saturation.
      require_audit_saturation: true
      power_alpha: 0.05
      power_target: 0.8
      probe_seed: 20260818
      # Fresh adapter audit population. The 60/20/20 split gives 360k fit,
      # 120k early-stop, and 120k final held-out audit events.
      probe_max_events: 600000
    # One weighted judge is used for staleness/acceptance; the old raw judge is
    # deliberately omitted. Every epoch traverses the complete fit split.
    audit_fit:
      # Effective global batch per class: 8192 rows/GPU across 16 GPUs.
      # Backward is split into 2048-row per-rank microbatches to preserve memory.
      batch_size: 131072
      train_microbatch_size_per_rank: 2048
      learning_rate: 0.0002
      weight_decay: 0.0005
      sampling: independent_epoch_shuffle
      safety_max_epochs: null
      min_epochs: 1
      validation_interval_epochs: 1.0
      validation_patience_epochs: 10.0
      validation_min_delta: 0.0001
      validation_batch_size: 65536
      progress_every_n_steps: 10
      restore_best: true
      require_saturation: false
    recalibration:
      candidates_per_event: 1
      bootstrap_on_start: true
      bootstrap_fail_closed: true
      # Do not force a special startup refit. The checkpointed OmniFold stack
      # and baseline continue on the normal audit cadence.
      refit_once_on_resume: false
      refit_once_id: adapter_regularized_v1
      # Total fixed cross-fit population. With two folds, each classifier fits
      # the complementary 600k events and predicts the other 600k out-of-fold.
      pool_events: 1200000
      # Independent held-out population for residual gates/final acceptance.
      score_pool_events: 300000
      pool_selection_seed: 42
      min_iterations: 2
      max_iterations: 12
      # Final candidate gate: fresh held-out OmniFold balanced accuracy must be
      # strictly below 0.51.
      acceptance_max_balanced_accuracy: 0.51
      tempering: 0.75
      # Event-level OOF recurrence: each training weight is predicted by a
      # classifier that did not fit that event. Fold models train sequentially.
      crossfit_folds: 2
      # Cross-fit ensemble continues only while its independent held-out
      # oriented AUC is > 0.51; AUC <= 0.51 is the no-op/closure stop.
      residual_min_auc_gain: 0.01
      seed: 20260819
      score_row_budget: 8192
      adapter_bottleneck: 16
      # These flags affect only the OmniFold classifier. The DGPO policy body
      # remains trainable through options.Training.Components above.
      train_layernorm: false
      train_encoder: false
      train_backbone: false
      decoder_hidden_dim: 128
      decoder_layers: 1
      decoder_heads: 4
      head_dropout: 0.15
      fit:
        # Per-class global effective batch. With 16 ranks this is 8192 truth and
        # 8192 generated rows per rank, evaluated as four 2048-row microbatches;
        # the two classes use separate forwards.
        # Effective global batch per class: 8192 rows/GPU across 16 GPUs.
        batch_size: 131072
        train_microbatch_size_per_rank: 2048
        learning_rate: 0.0002
        weight_decay: 0.0005
        sampling: independent_epoch_shuffle
        safety_max_epochs: null
        min_epochs: 1
        # Saturation means ten complete epochs in a row without validation-loss
        # improvement; there is no normal max-epoch stopping condition.
        validation_interval_epochs: 1.0
        validation_patience_epochs: 10.0
        # Internal classifier early-stopping/best-checkpoint tolerance only;
        # held-out BCE is not an outer OmniFold iteration usefulness gate.
        validation_min_delta: 0.0001
        # Shared by residual validation and fresh/acceptance audit evaluation.
        validation_batch_size: 65536
        progress_every_n_steps: 10
        restore_best: true
        require_saturation: true
  projection_constraint:
    type: none
