      validation_min_delta: 0.0001
      validation_batch_size: 2048
      progress_every_n_steps: 10
      restore_best: true
      require_saturation: false
    recalibration:
      reset_optimizer_state_on_install: true
      policy_warmup_steps: 10
      policy_warmup_start_factor: 0.1
      # Only iteration 1 inherits its same-fold checkpoint across refits.
      # Iterations 2..max_iterations clone THIS round's fitted iteration 1,
      # same fold; never chain from iteration 2 or import old iteration 2+.
      # Only weights transfer; AdamW and cumulative log weights start fresh.
      warm_start_iterations: [1]
      warm_start_from_iteration_one: true
      # Keep event identities in the same folds across warm-started refits.
      crossfit_partition: identity
