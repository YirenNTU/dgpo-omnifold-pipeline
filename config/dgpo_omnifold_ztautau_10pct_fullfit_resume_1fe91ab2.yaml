      # Floors use actual training-fold events / global batch.
      # Only a cache certified under this policy gets the shorter warm-start fit.
      training_readiness:
        # ~200k training events / 32768 global batch => 6 updates per epoch:
        # cold >=1500 updates; certified later warm fits >=30 updates.
        # Minimum budgets only: continue until validation-based early stopping.
        cold_start_min_epochs: 250
        warm_start_min_epochs: 5
      batch_size: 32768
      train_microbatch_size_per_rank: 2048
      drop_last_batch: true
