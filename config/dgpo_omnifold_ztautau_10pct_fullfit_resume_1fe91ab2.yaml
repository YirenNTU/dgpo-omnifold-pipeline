      decoder_heads: 4
      head_dropout: 0.15
      fit:
        anomaly_detection_steps: 0
        batch_size: 16384
        train_microbatch_size_per_rank: 1024
        drop_last_batch: true
        learning_rate: 0.0002
        # All iterations use the factory's iteration-1 trainable scope and LR.
