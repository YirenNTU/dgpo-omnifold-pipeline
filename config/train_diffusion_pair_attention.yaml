# Preserve pair identities in the existing generation attention; retain context FiLM.
extends_overlay: train_diffusion_relation_context.yaml
network:
  VisibleConditioning:
    diffusion_film_scale_enabled: true
    diffusion_pair_attention:
      enabled: true
      width: 32
      seed: 20260930
options:
  Training:
    model_checkpoint_save_path: /pscratch/sd/y/yiren/Ztautau/diffusion_pair_attention_02/checkpoints
    model_checkpoint_save_last: true
logger:
  local:
    name: diffusion-pair-attention
    save_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_pair_attention_02/logs
  wandb:
    id: pairattn02
    run_name: "Do pair attention biases improve physics? | context FiLM | filtered 50 epochs"
    group: Conditioning physics followup
    tags: [DiffusionOnly, NoRL, GPU16, PairedNoise, PairAttention, ContextControl, FilteredData]
nersc:
  ray:
    results_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_pair_attention_02/ray_results
  execution:
    command: >-
      shifter --image=registry.nersc.gov/m2616/avencast/evenet:1.3
      python3 -u scripts/train_neutrino_backend.py --backend pure-evenet
      --base-config config/train_diffusion_nersc.yaml
      --overlay-config config/train_diffusion_pair_attention.yaml
      -- --ray_dir /pscratch/sd/y/yiren/Ztautau/diffusion_pair_attention_02/ray_results
experiment:
  question: Does retaining observed pair geometry in attention improve generated physics?
  matched_control_wandb_run: relcontext02
  matched_configuration: config/train_diffusion_relation_context_filtered.yaml
  checkpoint_protocol: identical_pinned_raw_epoch286_weights_fresh_optimizer_scheduler
  intervention: visible_pair_bias_in_first_two_generation_attention_blocks
  primary_endpoint: epoch50_joint_radius_w1_pair_attention_minus_relcontext02
  interpretation: >-
    Keep the same context adapter, global FiLM scale/shift, PET, three generation
    blocks, data, optimizer schedule and16-GPU geometry as relcontext02. A shared
    pair encoder maps four bounded observed features to per-head, per-block
    additive visible-visible logits. No event pooling, truth, reconstructed target
    geometry or tau assignment. Invisible queries read the modified visible
    representations in subsequent blocks. Bias outputs start at zero; only blocks
    zero and one need bias heads because the final visible update cannot influence
    the invisible outputs. The source function is preserved at initialization.
    This tests the added pair-attention branch as a package; additional parameter
    capacity is not separately controlled. It is not a full AlphaFold Pairformer.
    Fixed50 epochs and matched DDIM20 panel; no H4 closure claim.
