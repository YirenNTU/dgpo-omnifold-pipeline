# Next-round dual-classifier experiment: weak/bulk reward, strong monitor-only.
# Pinned-inherit d17994d9 epoch=-1 OmniFold/raw-monitor stack; keep its still-
# cold diffusion-pretrain policy, then restart clocks/optimizer under the new
# round-rollback / no-hard-trust controller.
nersc:
  reproducibility:
    diffusion_pretrain_fraction: 0.1
    dgpo_training_fraction: 0.1
    classifier_backbone_protocol: matched_10pct_pretrain
    note: First start pinned-inherits d17994d9 dgpo-epoch=-1-next_ep=0-step=0.ckpt
      (diffusion-pretrain policy plus that run's installed dual-classifier
      OmniFold reward folds and raw monitor). Do not load d17994d9 last.ckpt.
      A smooth legacy width-128 one-layer classifier supplies the bounded DGPO
      density-ratio reward; an independent width-128 two-layer
      Fourier/topology/visible-rest classifier is monitor-only. Fit up to 10
      saturated legacy residuals and stop at the first held-out residual AUC <=
      0.52; that closure-only classifier is not installed. No cold OmniFold
      bootstrap on start. Residual 1 searches the largest alpha in [0.10,0.75]
      and may restore an earlier within-fit validation snapshot so
      train/validation ESS/N >= 0.30; later residuals warm-start inherit the
      previous classifier and reuse that residual-1 alpha (no independent raise).
      Reward log-ratio stays clipped sequentially to [-2.5,2.5]. Reference-trust
      keeps only its coefficient-0.2 soft objective; the hard adaptive boundary
      is disabled because d17994d9 rejected 77.8% of policy steps. Raw rollback
      is scoped to each installed reward round so later plateaus cannot return
      to the original step-5 global best. Raw patience is 4 before step 100 and
      8 thereafter. beta_kl=0. Fresh optimizer/clocks/global best;
      auto-resume only this output.
    source_checkpoint: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_10pct_dual_classifier_inheritalpha_ess30_t075_trust02_pretrain_seed42/checkpoints/dgpo-epoch=-1-next_ep=0-step=0.ckpt
    source_dgpo_global_step: 0
    source_epoch: -1
    source_next_epoch: 0
    source_wandb_run: ytchou97-university-of-washington/nu2flow-RL/d17994d9
