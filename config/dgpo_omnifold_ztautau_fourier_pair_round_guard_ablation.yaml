# Fourier-classifier convergence ablation. It resumes the v6 step-550
# checkpoint whose policy/reward/reference pair already passed every startup
# gate, keeping DGPO beta/reference-trust coefficient fixed at 1.0. This makes
# reverse-only recovery the only new treatment instead of resampling a noisy
# startup classifier. A saturated signed audit decision of -1 restores the
# incumbent, clears AdamW state, and refits the reward on a newly generated
# training pool without changing DGPO mathematics. The topology acceptance
# ceiling is relaxed from AUC 0.505 to the requested AUC 0.51.
# Launch after the 4-node Ray cluster is up:
#   shifter python3 evenet_dgpo/RL/DGPO_neutrino/dgpo_trainer.py \
#     config/dgpo_omnifold_ztautau_fourier_pair_round_guard_ablation.yaml \
#     --ray-dir /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_5pct_epoch54_fourier_pair_roundsearch_v7c_rewardmatched_topoauc051_signedrefresh_audit100k/ray_results
