  local:
    name: c4a91e07_h4_direction_no_ref_audit5_100step_v1
    version: h4_direction_no_ref_audit5_100step_v1
    save_dir: /pscratch/sd/y/yiren/Ztautau/c4a91e07_h4_direction_no_ref_audit5_100step_v1/logs
  wandb:
