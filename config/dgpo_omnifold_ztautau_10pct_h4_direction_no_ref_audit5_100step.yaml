# Measurement-only H4 gradient-direction pilot.
#
# Fit one two-fold, one-repeat, at-most-two-residual-iteration reward at step 0,
# freeze it, disable reference trust, and ask whether its DGPO gradient keeps
# pointing in the same direction as a freshly trained cold H4 audit.  The
# periodic audit is read-only: it cannot refit the reward, roll back the policy,
# or change optimizer state.
extends_overlay: dgpo_omnifold_ztautau_10pct_h4_minimal_alpha1_frozen_20step.yaml

experiment:
  protocol: h4-direction-no-reference-audit5-100step-v1
  single_question: >-
    With reference trust disabled, does the frozen H4 reward gradient remain
    aligned with a fresh H4 audit gradient while cold raw AUC moves toward 0.5?
  intervention: no_reference_trust_with_read_only_gradient_direction
  rounds: 1
  policy_updates_per_round: 100
  reward_lifetime_updates: 100
  reward_fit_count: 1
  # DGPO still needs its one frozen v_ref for the beta=1 likelihood-ratio
  # objective; only the additional reference-trust penalty is disabled.
  reference_snapshot_count: 1
  crossfit_folds: 2
  crossfit_repeats: 1
  residual_iterations_max: 2
  applied_tempering: 1.0
  applied_reference_trust_coefficient: 0.0
  cold_h4_audit_policy_steps: [0, 50, 100]
  gradient_direction_policy_steps: [50, 100]
  # Override the inherited 1,000-step pilot label as well as declaring the
  # exact fixed budget used by this experiment.
  cold_h4_audit_min_optimizer_updates: 3000
  cold_h4_audit_fixed_optimizer_updates: 3000
  primary_endpoint: audit/raw_auc_gap
  primary_decision_rule: >-
    The idea is supported only if the step-50 and step-100 cold audits each
    complete exactly 3000 optimizer updates, their installed-vs-fresh gradient
    directions are reliable and positively aligned, and raw abs(AUC-0.5) at
    step 100 is below step 0.
  stop_rule: >-
    Stop at policy step 100. Do not refit the reward, roll back the policy, or
    extend the run based on an intermediate audit.

nersc:
  reproducibility:
    note: >-
      Fresh weights-only start from c4a91e07 policy step 1110. Fit one frozen
      H4 reward using two identity-stable folds, one repeat, and a maximum of
      two residual iterations. Disable all applied reference trust. Run cold,
      read-only H4 audits every five epochs and compare their gradients with
      the installed reward gradient on the same deterministic event panel.
  ray:
    results_dir: /pscratch/sd/y/yiren/Ztautau/c4a91e07_h4_direction_no_ref_audit5_100step_v1/ray_results
  execution:
    command: >-
      shifter python3 scripts/train_neutrino_backend.py
      --backend dgpo-evenet
      --base-config config/train_diffusion_nersc.yaml
      --overlay-config config/dgpo_omnifold_ztautau_10pct_h4_direction_no_ref_audit5_100step.yaml
      -- --ray-dir /pscratch/sd/y/yiren/Ztautau/c4a91e07_h4_direction_no_ref_audit5_100step_v1/ray_results

