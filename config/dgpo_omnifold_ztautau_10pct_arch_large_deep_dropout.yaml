# Independent 10% architecture ablation. Step-260 policy weights only; all training clocks restart.
nersc:
  reproducibility:
    diffusion_pretrain_fraction: 0.1
    dgpo_training_fraction: 0.1
    classifier_backbone_protocol: matched_10pct_pretrain
    note: 'Architecture ablation large_deep_dropout: live state_dict only from common
      step-260 endpoint, fresh optimizer/clocks/global best and initial OmniFold;
      fixed clean staleness classifier. Independent output directory.'
  ray:
    results_dir: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_10pct_arch_large_deep_dropout_from260_seed42/ray_results
  execution:
    mode: ray_train_ddp
    workers: 16
    gpus_per_worker: 1
    command: shifter python3 scripts/train_neutrino_backend.py --backend dgpo-evenet
      --base-config config/train_diffusion_nersc.yaml --overlay-config config/dgpo_omnifold_ztautau_10pct_arch_large_deep_dropout.yaml
      -- --ray-dir /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_10pct_arch_large_deep_dropout_from260_seed42/ray_results
platform:
  data_parquet_dir: /pscratch/sd/y/yiren/Ztautau/omnifold_attention_10pct_stic_filtered_test1/train
  data_parquet_val_dir: /pscratch/sd/y/yiren/Ztautau/omnifold_attention_10pct_stic_filtered_test1/train
  batch_size: 512
  number_of_workers: 16
  resources_per_worker:
    CPU: 15
    GPU: 1
logger:
  wandb:
    profile: critical
    simplified: true
    resume: never
    fresh_run: true
    id: null
    project: nu2flow-RL
    entity: ytchou97-university-of-washington
    run_name: dgpo_omnifold_10pct_arch_large_deep_dropout_from260_seed42
    tags:
    - NERSC
    - Ztautau
    - DGPO
    - ScalingLawAllData10pct
    - ArchitectureAblation
    - large_deep_dropout
  local:
    save_dir: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_10pct_arch_large_deep_dropout_from260_seed42/logs
    name: dgpo_omnifold_10pct_arch_large_deep_dropout_from260_seed42
    version: arch_large_deep_dropout
options:
  Dataset:
    dataset_limit: 1.0
    val_dataset_limit: 1.0
  Training:
    total_epochs: 150
    epochs: 150
    weight_decay: 0.001
    decoupled_weight_decay: true
    model_checkpoint_load_path: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_10pct_v26_resume3_rawplateau5_patience6_val3_returnbest_notopology_d128_l1_velocity_mse_trust10_globalbestdecay09_warm20from10_dropout15_seed42/checkpoints/dgpo-epoch=25-next_ep=26-step=260.ckpt
    pretrain_model_load_path: null
    model_checkpoint_save_path: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_10pct_arch_large_deep_dropout_from260_seed42/checkpoints
    model_checkpoint_save_top_k: 0
    Components:
      InvisibleInputProjector:
        weight_decay: 0.001
      GroupedSequentialEmbedding:
        weight_decay: 0.001
      GlobalEmbedding:
        weight_decay: 0.001
      PET:
        weight_decay: 0.001
      TruthGeneration:
        weight_decay: 0.001
      ObjectEncoder:
        freeze:
          type: full
          partial_freeze_components: []
          random_freeze_fraction: 0.0
    EMA:
      replace_model_after_load: false
      use_for_generation: false
network:
  Body:
    GroupedSequentialEmbedding:
      dropout: 0.0
    GlobalEmbedding:
      dropout: 0.0
    PET:
      feature_drop: 0.0
      dropout: 0.0
      drop_probability: 0.0
  TruthGeneration:
    feature_drop: 0.0
    dropout: 0.0
    drop_probability: 0.0
rl:
  enabled: true
reward_config:
  type: omnifold
  weight: 1.0
  omnifold:
    bootstrap_in_dgpo: true
    bundle_file: null
    backbone_checkpoint: /pscratch/sd/y/yiren/Ztautau/diffusion_pretrain_10pct_seed42/checkpoints/last.ckpt
ztautau_domain:
  enabled: true
  feature_names:
  - theta
  - phi
  token_sources:
    event_token: event_token
    object_token: object_token
  topology:
    kind: back_to_back
    target_cos_opening: -1.0
    target_delta_phi_to_pi: 0.0
