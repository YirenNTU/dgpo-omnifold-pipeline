    - topology/delta_phi_to_pi
  tarp:
    enabled: false
    profile: visible_acoplanarity
    n_bins: 4
    min_events: 500
    arms:
    - full
    - rank_copula
    n_null_assignments: 399
    n_reference_trials: 8
    seed: 20260820
    alpha: 0.05
    pooled_panel: true
  adaptive_omnifold:
    enabled: true
    log_only: false
    monitor_mode: raw_plateau_refit
    single_pool_train_validation: true
    single_pool_split_seed: 42
    baseline_probe_on_start: true
