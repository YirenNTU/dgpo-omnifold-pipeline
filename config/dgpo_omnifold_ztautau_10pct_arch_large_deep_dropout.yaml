      retrain_cooldown_epochs: 0
      require_audit_saturation: true
      power_alpha: 0.05
      power_target: 0.8
      probe_seed: 20260905
      probe_max_events: 250000
    classifier_trust:
      enabled: false
      probe_max_events: null
    audit_fit:
