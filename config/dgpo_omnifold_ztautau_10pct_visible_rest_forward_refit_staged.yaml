      exact visible-only boost, no tau energy/mass hypothesis; 8->64->32 independent encoder;
      redundant boost/energy/beam-angle channels and validity flags removed, numerical guards retained;
      raw-refit patience 4/8/16/24 at DGPO steps 0/100/300/600; classifier patience remains 10 data epochs;
      derived rest columns excluded from identity hashing to preserve Fourier-control folds;
      live policy state_dict only from the final step-320 checkpoint of W&B f6b4ec46,
      fresh optimizer/clocks/global best and initial OmniFold; first policy update is step 1;
      staleness uses the identical OmniFold architecture and packed inputs,
      two width-128 decoder layers with four heads and dropout 0.15,
      with separate weights/caches and certified cold250/warm5 epoch fitting;
      reward folds use cold minimum 1000 updates or warm minimum 10 actual fold data epochs;
      both classifiers validate every 2 data epochs, with full final scoring;
      only iteration 1 inherits across refits; later iterations initialize from
      the current round iteration 1 same-fold best checkpoint, with fresh
      zero residual output head; output first trains alone at 5e-5; then last decoder trains at 1e-5
      with output at 5e-5, retaining stage A unless stage B improves validation BCE,
      inherited feature extractors frozen with dropout disabled;
      each stage resets its classifier optimizer, each refit resets cumulative weights.
      Raw monitor also inherits its
      own complete same-architecture state after the first successful fit.
      Fixed CPU event inputs with fixed identity splits; only training batches shuffle;
      separate loss curves per classifier fit on local optimizer steps.
      New from_f6b4ec46_step320 output directory; no reward stack,
      monitor, optimizer, EMA, reference or global-best baseline is imported.'
