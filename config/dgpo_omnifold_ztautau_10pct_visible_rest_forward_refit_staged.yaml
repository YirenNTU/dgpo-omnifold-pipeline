# Forward-only refit ablation of 4267caeb: SAME source step320, fresh step0.
# Global best remains saved; no policy rollback or failed-round early stop.
# Trust coefficient=1 and tempering=1 unchanged. Iteration 2+ uses two-stage fitting.
# Visible-pair rest-frame ablation; no tau-energy or tau-mass hypothesis.
# Exact visible E,px,py,pz boost; compact 8-channel v3 context in BOTH classifiers.
# Both classifiers use two width-128 decoder layers, four heads, dropout 0.15.
# Staleness patience grows 4 -> 8 -> 16 -> 24 with persisted DGPO global_step.
# Independent 10% Fourier ablation. f6b4ec46 final step-320 live policy; clocks restart.
# Initial classifiers are fresh; later matching reward folds and raw monitor warm-start.
