      - start_step: 0
        required_consecutive_checks: 4
      - start_step: 100
        required_consecutive_checks: 8
      - start_step: 300
        required_consecutive_checks: 16
      - start_step: 600
        required_consecutive_checks: 24
      rollback_to_best_on_plateau: false
      retrain_cooldown_epochs: 0
      require_audit_saturation: true
      power_alpha: 0.05
      power_target: 0.8
      probe_seed: 20260905
      probe_max_events: 250000
    classifier_trust:
      enabled: false
      probe_max_events: null
    audit_fit:
      # Architecture lives ONLY in recalibration below: no audit architecture
      # overrides. reset_audit_bank uses the SAME model builder/packing spec,
      # including Fourier11 + visible-rest8 and every trainable component.
      # Weights/caches remain separate. Batch sizes/training budgets may differ.
      # Floors use actual training-fold events / global batch.
      # Only a cache certified under this policy gets the shorter warm-start fit.
      training_readiness:
        # ~200k training events / 32768 global batch => 6 updates per epoch:
        # cold >=1500 updates; certified later warm fits >=30 updates.
        # Minimum budgets only: continue until validation-based early stopping.
        cold_start_min_epochs: 250
        warm_start_min_epochs: 5
      batch_size: 32768
      train_microbatch_size_per_rank: 2048
      drop_last_batch: true
      # Drop only TRAIN tails after shuffling; validation evaluates every row.
      learning_rate: 0.0002
      weight_decay: 0.0005
      gradient_clip_norm: 5.0
      sampling: independent_epoch_shuffle
      safety_max_epochs: null
      min_steps: 0
      min_epochs: 1
      validation_interval_epochs: 2.0
      validation_patience_epochs: 10.0
      validation_min_delta: 0.0001
      validation_batch_size: 2048
      progress_every_n_steps: 10
      restore_best: true
      require_saturation: false
    recalibration:
      reset_optimizer_state_on_install: true
      policy_warmup_steps: 10
      policy_warmup_start_factor: 0.1
      # Only iteration 1 inherits its same-fold checkpoint across refits.
      # Iterations 2..max_iterations clone THIS round's fitted iteration 1,
      # same fold; never chain from iteration 2 or import old iteration 2+.
      # Only weights transfer; AdamW and cumulative log weights start fresh.
      warm_start_iterations: [1]
      warm_start_from_iteration_one: true
      # Keep event identities in the same folds across warm-started refits.
      crossfit_partition: identity
      # Outer 80/20 uses single_pool_split_seed=42; crossfit seed is the fixed
