      candidates_per_event: 1
      bootstrap_on_start: true
      bootstrap_fail_closed: true
      refit_once_on_resume: false
      refit_once_fail_closed: false
      refit_once_id: ''
      pool_events: null
      score_pool_events: null
      pool_selection_seed: 42
      min_iterations: 1
      max_iterations: 10
      acceptance_audit_enabled: false
      acceptance_max_balanced_accuracy: 0.51
      topology_acceptance_audit_enabled: false
      topology_acceptance_max_auc_gap: 0.005
      topology_acceptance_repeats: 1
      periodic_pair_features: true
      topology_fourier_embedding: true
      tempering: 1.0
      crossfit_folds: 2
      residual_min_auc_gain: 0.01
      seed: 20260906
      score_row_budget: 2048
      adapter_bottleneck: 16
      train_layernorm: false
      train_encoder: false
      train_grouped_sequential_embedding: true
      train_invisible_projector: true
      train_backbone: false
      asymmetric_attention: true
      decoder_hidden_dim: 128
      decoder_layers: 2
      decoder_heads: 4
      head_dropout: 0.15
      fit:
        anomaly_detection_steps: 0
        batch_size: 16384
        train_microbatch_size_per_rank: 1024
        drop_last_batch: true
        learning_rate: 0.0002
        # Iteration 1 (cold or cross-round warm) keeps 2e-4. Iteration 2+
        # starts from current iteration 1: output-only A, then last-block B.
        # A and B each keep the warm minimum below and fresh AdamW.
        # Only B decoder uses 1e-5; output stays 5e-5. Frozen modules stay eval.
        later_iteration_learning_rate: 0.00005
        later_iteration_train_mode: output_then_last_decoder
        later_iteration_decoder_learning_rate: 0.00001
        backbone_learning_rate: 1.0e-05
        weight_decay: 0.0005
        gradient_clip_norm: 5.0
        sampling: independent_epoch_shuffle
        safety_max_epochs: null
        min_steps: 1
        # Cold iteration-1 folds keep 1000 updates. Successful cross-round
        # or current iteration-1 warm starts use 10 actual data epochs.
        # These are minimum budgets, never hard caps; saturation is required.
        min_steps_per_fold: 1000
        warm_start_min_epochs_per_fold: 10
        min_epochs: 1
        validation_interval_epochs: 2.0
        validation_patience_epochs: 10.0
        validation_min_delta: 0.0001
        validation_batch_size: 2048
        progress_every_n_steps: 10
        restore_best: true
        require_saturation: true
      topology_conditioning: true
      visible_pair_rest_frame: true
      topology_max_harmonic: 4
      topology_include_theta_pair: true
      topology_hidden_dim: 64
      topology_embedding_dim: 32
      topology_dropout: 0.15
