expected_source_schema: c4a91e07-h4-weak-classifier-trajectory-v1
expected_policy_step: 1110

reward_stage: ba_lcb_55
selected_members:
  - {seed: 20260913, fold: 1}
  - {seed: 20260913, fold: 2}

workers: 16
cpus_per_worker: 2
probe_events: 2048
K: 8
gradient_events: 1024
gradient_blocks: 8
gradient_timesteps: 4
gradient_seed: 20261313
beta: 1.0
policy_eval_t_min: 0.0
policy_eval_t_max: 0.7
raw_tempering: 0.75
score_batch_size: 32768

# Parameter-space radius, not an AdamW LR. The winning radius will be mapped
