# Single control YAML for Ztautau adaptive OmniFold-guided DGPO.
# Launch after the 4-node Ray cluster is up:
#   shifter python3 evenet_dgpo/RL/DGPO_neutrino/dgpo_trainer.py \
#     config/dgpo_omnifold_ztautau.yaml \
#     --ray-dir /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_5pct_bestdiff_acceptance_adapteronly/ray_results
#
# This is the materialized base+DGPO configuration. Diffusion pretraining
# continues to use config/train_diffusion_nersc.yaml independently.
nersc:
  submit: false
  system: perlmutter
  account: m5019_g
  qos: regular
  constraint: gpu
  time: '10:00:00'
  nodes: 4
  gpus_per_node: 4
  ntasks_per_node: 1
  cpus_per_task: 128
  image: registry.nersc.gov/m2616/avencast/evenet:1.3
  repo_root: /global/homes/y/yiren/ml_pipeline
  ray:
    start_script: /global/homes/y/yiren/ml_pipeline/NERSC/start_interactive_ray.sh
    temp_dir: /tmp/r${UID}_${SLURM_JOB_ID}
    results_dir: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_5pct_bestdiff_acceptance_adapteronly/ray_results
    experimental_noset_cuda_visible_devices: null
  execution:
    mode: ray_train_ddp
    workers: 16
    gpus_per_worker: 1
    command: shifter python3 evenet_dgpo/RL/DGPO_neutrino/dgpo_trainer.py config/dgpo_omnifold_ztautau.yaml
      --ray-dir /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_5pct_bestdiff_acceptance_adapteronly/ray_results
  reproducibility:
    dataset_shuffle_seed: 42
    note: EveNet currently hard-codes the Ray dataset shuffle seed to 42; model and
      diffusion RNG seeding are not yet exposed through the training YAML.
platform:
  # Use exactly the same fixed seed-42 5% identities as diffusion pretraining.
  data_parquet_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_train_5pct_seed42/train
  data_parquet_val_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_val_20pct_seed42/val
  number_of_workers: 16
  resources_per_worker:
    CPU: 20
    GPU: 1
  batch_size: 1024
  prefetch_batches: 1
  use_gpu: true
logger:
  wandb:
    project: nu2flow-RL
    run_name: dgpo_omnifold_5pct_bestdiff_acceptance_adapteronly
    tags:
    - NERSC
    - Ztautau
    - DGPO
    - OmniFoldReward
    - TARP
    - TargetedPhysics
    - Diffusion5pctInit
    - TrainableInvisibleProjector
    - DirectionalPETAttention
    - CandidateVisibleCrossAttention
    - AdapterOnlyClassifier
    - InternalPETAdapter
    entity: ytchou97-university-of-washington
    simplified: true
  local:
    save_dir: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_5pct_bestdiff_acceptance_adapteronly/logs
    name: dgpo_omnifold_5pct_bestdiff_acceptance_adapteronly
    version: v1
options:
  default: evenet_defaults/options.yaml
  Training:
    total_epochs: 1500
    epochs: 1500
    # DGPO's reward changes whenever OmniFold is refitted, so reward-ranked
    # checkpoints are not comparable across rounds. Keep only unpruned recovery
    # snapshots and the atomic last.ckpt pointer.
    model_checkpoint_save_top_k: 0
    # Resume the corrected best-diffusion DGPO run, including optimizer,
    # epoch/step, reference policies, reward stack, and adaptive controller.
    model_checkpoint_save_path: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_5pct_bestdiff_acceptance_adapteronly/checkpoints
    model_checkpoint_load_path: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_5pct_bestdiff_acceptance_adapteronly/checkpoints/last.ckpt
    pretrain_model_load_path: null
    freeze_modules: []
    diffusion_every_n_epochs: 20
    diffusion_every_n_steps: 1
    eval_metrics_every_n_epochs: 1
    apply_event_weight: false
    learning_rate: 0.0001
    learning_rate_body: 1.0e-05
    learning_rate_classification: 0.0002
    learning_rate_median: 0.0002
    Components:
      InvisibleInputProjector:
        learning_rate: 0.0001
        optimizer_group: projector
        optimizer_type: adamW
      GroupedSequentialEmbedding:
        learning_rate: 0.0001
        optimizer_group: projector
        optimizer_type: adamW
        warm_up: true
        weight_decay: 0.01
        decoupled_weight_decay: true
      GlobalEmbedding:
        learning_rate: 1.0e-05
        optimizer_group: body
        optimizer_type: adamW
        warm_up: true
      PET:
        learning_rate: 1.0e-05
        optimizer_group: body
        optimizer_type: adamW
        warm_up: true
      ObjectEncoder:
        learning_rate: 1.0e-05
        optimizer_group: object_encoder
        optimizer_type: adamW
        warm_up: true
      Classification:
        learning_rate: 0.0002
        include: false
        optimizer_type: adamW
      Regression:
        include: false
      Assignment:
        include: false
      Segmentation:
        include: false
      GlobalGeneration:
        include: false
      ReconGeneration:
        include: false
      TruthGeneration:
        include: true
        diffusion_steps: 50
        optimizer_type: adamW
        learning_rate: 0.0001
        optimizer_group: truth_generation
    EarlyStopping:
      patience: 1000
      min_delta: 0.0
      monitor: val/loss
      mode: min
      verbose: true
    FAMO:
      turn_on: false
      detailed_loss: false
    EMA:
      enable: true
      decay: 0.999
      start_epoch: 0
      update_every_n_steps: 1
      # W&B selected epoch 224 by live val/loss, so load its live state_dict
      # instead of replacing it with the separately tracked EMA shadow.
      replace_model_after_load: false
      replace_model_at_end: false
      use_for_generation: false
    ProgressiveTraining:
      stages:
      - name: neutrino_only
        epoch_ratio: 1.0
        transition_ratio: 0.0
        loss_weights:
          generation-truth:
          - 1.0
          - 1.0
  Dataset:
    dataset_limit: 1.0
    normalization_file: /global/cfs/cdirs/m5019/tihsu/Ztautau/evenet-input/normalization.pt
    val_split:
    - 0.8
    - 1.0
    # This directory is already the fixed 20% validation subset (~119k). Do not
    # limit it a second time; full DGPO validation is separately batch-capped.
    val_dataset_limit: 1.0
  Metrics:
    Generation-Binning:
      neutrino-energy:
      - 121
      - 0
      - 60
      neutrino-pt:
      - 121
      - 0
      - 60
      neutrino-eta:
      - 121
      - -0.15
      - 0.15
      neutrino-phi:
      - 121
      - -0.05
      - 0.05
      neutrino-theta:
      - 121
      - -0.05
      - 0.05
    ObjectTag-Embedding:
      enable: true
      group_name: ObjectTag
      label_feature: Part_pdgId
      max_points: 10000
      max_batches: 10
      log_every_n_epochs: 20
      alpha: 0.8
      marker_size: 8.0
      outlier_percentile_low: 0.5
      outlier_percentile_high: 99.5
      others_label: others
      interested_labels:
        '41': pi
        '2': e
        '6': mu
        '21': gamma
        '42': K
        '47': pi0
        '61': K_S0
        '62': K_L0
        '65': p
        '66': n
network:
  default: evenet_defaults/network-20M.yaml
  Body:
    GroupedSequentialEmbedding:
      hidden_dim_scale: 2.0
      dropout: 0.0
    PET:
      feature_drop: 0.0
  TruthGeneration:
    feature_drop: 0.0
event_info:
  default: generated_event_info.yaml
resonance:
  default: resonance.yaml
rl:
  enabled: true
reward_config:
  type: omnifold
  weight: 1.0
  omnifold:
    bootstrap_in_dgpo: true
    bundle_file: null
    backbone_checkpoint: /pscratch/sd/y/yiren/Ztautau/diffusion_pretrain_5pct_seed42/checkpoints/epoch=224_train=0.1291_val=0.1279.ckpt
    # Each OmniFold fold builds its own classifier body from this checkpoint.
ztautau_domain:
  enabled: true
  feature_names:
  - theta
  - phi
dgpo:
  # Full DGPO resume from the checkpoint above.
  checkpoint_load_mode: resume
  # Match EveNet pretraining: faster tensor-core matmuls with float32 I/O.
  float32_matmul_precision: medium
  advantage_estimator: leave_one_out_unscaled
  K: 8
  beta: 1.0
  beta_kl: 0.0
  reference_trust:
    enabled: true
    coefficient: 1.0
  num_ddim_steps: 20
  # Recompute the 16 PET transformer blocks during backward instead of retaining
  # all intermediate activations for the K*B current-policy forward.
  activation_checkpointing: true
  validation_K: 16
  # Cheap monitoring stays frequent but only evaluates current-policy reward
  # scalars on 2 batches/rank. It does not run the reference policy, plots, or TARP.
  validation_cheap_K: 8
  validation_cheap_max_batches: 2
  validation_cheap_log_batches: false
  validation_num_ddim_steps: 20
  # Rollout is forward-only/no-grad, so evaluate all K=8 chains together.
  # Gradient-bearing policy evaluation remains independently capped at 256 events.
  rollout_parallel_chains: 8
  validation_rollout_parallel_chains: 8
  # Keep validation statistics/cost unchanged while DGPO training uses B=1024.
  validation_batch_size: 512
  num_train_timesteps: 8
  # Keep the full B=1024 DGPO objective and one AdamW update, but evaluate the
  # gradient-bearing policy in four 256-event chunks to bound activation memory.
  policy_eval_event_microbatch_size: 256
  policy_eval_parallel_timesteps: 1
  # Update the recovery checkpoint every five logical epochs. Audit/refit and
  # final boundaries are also saved when they do not land on this cadence.
  checkpoint_every_n_steps: 0
  checkpoint_every_n_epochs: 5
  # Short logical epochs do not restart the Ray iterator. With 16 workers and
  # batch_size=1024, one 1.6M-event data pass is about 98 optimizer steps, or
  # about 10 logical epochs.
  steps_per_epoch: 10
  adv_clip_max: null
  grad_clip_norm: 1.0
  policy_eval_t_min: 0.0
  policy_eval_t_max: 0.7
  ema_rollout_decay_max: 0.3
  ema_rollout_decay_ramp: 0.001
  log_every: 1
  # Full K=16 + reference + compact Ztautau/TARP diagnostics every 10 logical epochs.
  # The cheap and full cadences coincide, so the full pass replaces the cheap
  # pass and validation runs exactly once every 10 epochs.
  validation_every_n_epochs: 10
  validation_full_every_n_epochs: 10
  validation_compute_winrate: true
  validation_log_batches: true
  validation_max_batches: 13
  diagnostic_plots:
    enabled: false
  # Full validation already covers the same distributions. Disable duplicate
  # train_dist arrays, cross-rank gathers, and plots in the compact W&B profile.
  train_dist_enabled: false
  ztautau_metrics:
    enabled: true
    candidate_index: 0
    bins: 60
    log_images: true
  tarp:
    enabled: true
    profile: visible_acoplanarity
    n_bins: 4
    min_events: 500
    arms:
    - full
    - rank_copula
    n_null_assignments: 399
    n_reference_trials: 8
    seed: 20260820
    alpha: 0.05
    pooled_panel: true
  adaptive_omnifold:
    enabled: true
    log_only: false
    baseline_probe_on_start: true
    # No-grad K=1 DDIM population generation only. Independent of the DGPO
    # policy batch (1024) and classifier global batch (16384 per class).
    pool_generation_batch_size: 1024
    # Cheap fresh-classifier staleness probe every 50 optimizer steps: five
    # DGPO logical epochs. A positive probe launches a fresh cross-fit stack,
    # which must reach 100k held-out residual closure and then pass the fresh
    # candidate acceptance audit before installation.
    staleness_every_n_epochs: 5
    trigger:
      # Fixed installed-round controller: retrain when the current weighted
      # |AUC-0.5| exceeds the same-50k-protocol baseline by 0.005, i.e. half an
      # AUC percentage point.
      retrain_auc_margin: 0.005
      # Avoid leaving a locally adequate but stale reward installed through a
      # long policy plateau. Checked at the 5-epoch probe cadence; the fresh
      # cross-fit candidate must still reach saturated residual closure and
      # pass the fresh acceptance audit.
      max_reward_age_epochs: 20
      required_consecutive_epochs: 1
      # A threshold crossing may stop a routine audit immediately; a healthy
      # routine-audit decision still requires saturation.
      require_audit_saturation: true
      power_alpha: 0.05
      power_target: 0.8
      probe_seed: 20260818
      # Cheap routine probe. Its 60/20/20 split gives 30k fit, 10k early-stop,
      # and 10k untouched audit events. At the configured 0.005 AUC margin this
      # is intentionally a sensitive sentinel. New stacks establish their
      # controller baseline with this same protocol after candidate acceptance.
      probe_max_events: 50000
    # One weighted judge is used for staleness and the installed-round baseline;
    # the old raw judge is omitted. Each epoch uses all complete shuffled
    # batches and drops only its undersized final batch.
    audit_fit:
      # 1024 event conditions per worker and optimizer step across 16 workers.
      # Truth/generated are evaluated separately for the same nominal batch.
      batch_size: 16384
      train_microbatch_size_per_rank: 1024
      drop_last_batch: true
      learning_rate: 0.0002
      weight_decay: 0.0005
      sampling: independent_epoch_shuffle
      safety_max_epochs: null
      min_epochs: 1
      validation_interval_epochs: 1.0
      validation_patience_epochs: 10.0
      validation_min_delta: 0.0001
      validation_batch_size: 65536
      progress_every_n_steps: 10
      restore_best: true
      require_saturation: false
    recalibration:
      candidates_per_event: 1
      bootstrap_on_start: true
      bootstrap_fail_closed: true
      # A new run builds the initial reward before the first DGPO update.
      refit_once_on_resume: true
      # Adapter-only fitting with PET's registered internal adapters.
      refit_once_id: internal_adapter_crossattention_5pct_v12_bestdiff_auc051
      # Cross-fit the fixed 5% population. The 208,354 events split evenly
      # into two 104,177-event folds. Each epoch drops only its shuffled short
      # final batch; reshuffling rotates which events are omitted next epoch.
      pool_events: 208354
      # Independent held-out population for residual closure and final fresh
      # candidate acceptance.
      score_pool_events: 100000
      pool_selection_seed: 42
      min_iterations: 2
      max_iterations: 5
      # After residual closure, a completely fresh classifier must be unable to
      # distinguish truth from candidate-weighted generation beyond 51% BA.
      acceptance_audit_enabled: true
      acceptance_max_balanced_accuracy: 0.51
      tempering: 0.75
      # Event-level OOF recurrence: each training weight is predicted by a
      # classifier that did not fit that event. Fold models train sequentially.
      crossfit_folds: 2
      # Continue residual correction while the independent held-out oriented
      # AUC is > 0.51. AUC <= 0.51 is residual closure; the completed stack
      # must then pass the separate fresh acceptance audit.
      residual_min_auc_gain: 0.01
      seed: 20260819
      score_row_budget: 8192
      adapter_bottleneck: 16
      # Each fold receives an independent copy of the same frozen pretrained
      # body. PET uses its registered internal adapter stack; no external
      # adapters are created by the classifier head.
      train_layernorm: false
      train_encoder: false
      # This module exists in the current diffusion architecture but was absent
      # from the legacy pretraining checkpoint. Train and checkpoint it with
      # every fresh cross-fit classifier instead of freezing random weights.
      train_invisible_projector: true
      train_backbone: false
      # Restore the pretrained diffusion direction: visible queries cannot read
      # invisible candidate keys, while invisible queries can read the visible
      # event. The candidate decoder then applies explicit cross-attention to
      # the read-only visible PET memory.
      asymmetric_attention: true
      decoder_hidden_dim: 128
      decoder_layers: 1
      decoder_heads: 4
      head_dropout: 0.15
      fit:
        # 1024 event conditions per worker and optimizer step. The 104,177-event
        # fold takes six complete global optimizer steps per classifier epoch;
        # the shuffled 5873-event remainder is dropped. Truth
        # and generated graphs are evaluated/backpropagated separately.
        batch_size: 16384
        train_microbatch_size_per_rank: 1024
        drop_last_batch: true
        learning_rate: 0.0002
        weight_decay: 0.0005
        sampling: independent_epoch_shuffle
        safety_max_epochs: null
        min_epochs: 1
        # Saturation means ten complete epochs in a row without validation-loss
        # improvement; there is no normal max-epoch stopping condition.
        validation_interval_epochs: 1.0
        validation_patience_epochs: 10.0
        # Internal classifier early-stopping/best-checkpoint tolerance only;
        # held-out BCE is not an outer OmniFold iteration usefulness gate.
        validation_min_delta: 0.0001
        # Batched evaluation of the independent residual-validation pool.
        validation_batch_size: 65536
        progress_every_n_steps: 10
        restore_best: true
        require_saturation: true
  projection_constraint:
    type: none
