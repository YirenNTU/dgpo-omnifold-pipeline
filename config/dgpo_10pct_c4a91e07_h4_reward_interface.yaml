# Fixed-policy classifier-to-DGPO diagnostic.  This is not a training resume:
# c4a91e07/last.ckpt supplies policy weights only; optimizer/reward state is ignored.
base_config: config/train_diffusion_nersc.yaml
overlay_config: config/dgpo_omnifold_ztautau_10pct_old_method_hard_dropout015.yaml
source_wandb_run: ytchou97-university-of-washington/nu2flow-RL/c4a91e07
expected_policy_checkpoint: /pscratch/sd/y/yiren/Ztautau/dgpo_omnifold_10pct_old_method_hard_nc4shnpg_t075_trust1_nohardtrust_seed42/checkpoints/last.ckpt
expected_policy_step: 1110
output_dir: /pscratch/sd/y/yiren/Ztautau/c4a91e07_h4_reward_interface_v5

workers: 16
cpus_per_worker: 2
pool_events: null
generation_batch_size: 1024
score_batch_size: 32768
generation_seed: 20260913

# Partition by event identity, never candidate values.  The five populations are disjoint.
partition_seed: 20260913
partition_fractions:
  reward_fit: 0.50
  early_stop: 0.15
  calibration: 0.10
  judge_fit: 0.15
  final_audit: 0.10

# One residual increment, cold model and fresh AdamW for every member.
training_seeds: [20260913, 20260914]
folds: 2
fold_seed: 20260819
classifier_fit:
  steps: 3000
  min_steps: 1000
  batch_size: 16384
  train_microbatch_size_per_rank: 1024
  drop_last_batch: true
  learning_rate: 0.0002
  backbone_learning_rate: 0.00001
  weight_decay: 0.0005
  gradient_clip_norm: 5.0
  sampling: independent_epoch_shuffle
  validation_interval_steps: 100
  validation_patience_evaluations: 10
  validation_min_delta: 0.0001
  validation_batch_size: 65536
  progress_every_n_steps: 10
  restore_best: true
  # Ordering is the signal under test; scalar calibration is fit separately.
  checkpoint_selection_metric: balanced_accuracy
  require_saturation: false
  topology_warmup_steps: 0
  topology_body_unfreeze_step: 0
  topology_warmup_learning_rate: null

# The judge uses H4 too, but fits on a separate identity partition and seed.
judge_seed: 20261013

# All arms consume these same logits, candidates, events, diffusion times/noise.
K: 8
raw_tempering: 0.75
beta: 1.0
candidate_seed: 20261113
probe_selection_seed: 20261213
signed_probe_events: 2048
gradient_events: 1024
gradient_blocks: 8
gradient_timesteps: 4
gradient_seed: 20261313
event_gradient_events: 32
policy_eval_t_min: 0.0
policy_eval_t_max: 0.7

# +epsilon is gradient descent on each DGPO loss; -epsilon is its paired control.
signed_step_rms: 0.00001
signed_rollout_seed: 20261413
physics_bins: 60
response_bins: 12
response_bootstrap_replicates: 1000
response_bootstrap_seed: 20261513

# A separate diagnostic run.  It does not append to c4a91e07.
wandb:
  enabled: true
  entity: ytchou97-university-of-washington
  project: nu2flow-RL
  name: c4a91e07_h4_reward_interface_fixed_policy_v5
  tags:
    - NERSC
    - Ztautau
    - DGPO
    - FixedPolicyDiagnostic
    - SourceC4a91e07Last
    - H4
    - ColdStart
    - TwoSeedsTwoFolds
    - RewardInterface
    - NoPolicyUpdate
    - NoHardTrust
