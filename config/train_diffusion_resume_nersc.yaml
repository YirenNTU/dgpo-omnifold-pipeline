# Full-state pure-diffusion continuation ablation from the checkpoint used to
# initialize DGPO.  All outputs live under a separate root so this control can
# never overwrite the original diffusion or DGPO checkpoints.
# The Slurm allocation and Ray cluster are started separately by the user.
# This file contains only configuration consumed by EveNet training.

platform:
  data_parquet_dir: /global/cfs/cdirs/m5019/tihsu/Ztautau/evenet-input/train-diffusion
  data_parquet_val_dir: /global/cfs/cdirs/m5019/tihsu/Ztautau/evenet-input/val-diffusion
  number_of_workers: 16
  resources_per_worker:
    CPU: 20
    GPU: 1
  # Per worker: 2048. Effective global batch: 2048 x 16 = 32768.
  batch_size: 2048
  prefetch_batches: 1
  use_gpu: true

logger:
  wandb:
    project: EveNet
    run_name: &logger_name Ztautau-Diffusion-Pure-Continuation-Ablation-from-e194
    tags: [EveNet, Ztautau, Diffusion, PureDiffusion, Ablation, Resume, FromE194, NERSC, Perlmutter, MultiNode]
    entity: ytchou97-university-of-washington
    simplified: false
  local:
    save_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_pure_continuation_ablation_from_e194/logs
    name: *logger_name
    version: ablation_from_e194

options:
  default: evenet_defaults/options.yaml

  Training:
    # Full-state resume preserves the original optimizer/scheduler state and
    # continues toward the same 1500-epoch cosine horizon as the pretrained run.
    total_epochs: 1500
    epochs: 1500
    # Deliberately asymmetric: read the exact DGPO baseline, but write only to
    # the isolated pure-diffusion ablation directory.
    model_checkpoint_load_path: /pscratch/sd/y/yiren/Ztautau/diffusion_pretrain_v1/checkpoints/epoch=194_train=0.1122_val=0.1112.ckpt
    model_checkpoint_save_path: /pscratch/sd/y/yiren/Ztautau/diffusion_pure_continuation_ablation_from_e194/checkpoints
    # Full Lightning resume above already restores weights and optimizer state.
    pretrain_model_load_path: null
    freeze_modules: []
    diffusion_every_n_epochs: 20
    diffusion_every_n_steps: 1
    eval_metrics_every_n_epochs: 1
    apply_event_weight: false

    learning_rate: &lr 0.0002
    learning_rate_body: &lr_body 0.00002
    learning_rate_classification: &lr_classification 0.0002
    learning_rate_median: &lr_median 0.0002

    Components:
      InvisibleInputProjector:
        learning_rate: *lr
        optimizer_group: projector
        optimizer_type: adamW

      GroupedSequentialEmbedding:
        learning_rate: *lr
        optimizer_group: projector
        optimizer_type: adamW
        warm_up: true
        weight_decay: 0.01
        decoupled_weight_decay: true

      GlobalEmbedding:
        learning_rate: *lr
        optimizer_group: body
        optimizer_type: adamW
        warm_up: true

      PET:
        learning_rate: *lr_body
        optimizer_group: body
        optimizer_type: adamW
        warm_up: true

      ObjectEncoder:
        learning_rate: *lr_median
        optimizer_group: object_encoder
        optimizer_type: adamW
        warm_up: true

      Classification:
        learning_rate: *lr_classification
        include: false
        optimizer_type: adamW

      Regression:
        include: false

      Assignment:
        include: false

      Segmentation:
        include: false

      GlobalGeneration:
        include: false

      ReconGeneration:
        include: false

      TruthGeneration:
        include: true
        diffusion_steps: 50
        optimizer_type: adamW
        learning_rate: *lr

    EarlyStopping:
      patience: 1000
      min_delta: 0.0
      monitor: val/loss
      mode: min
      verbose: true

    FAMO:
      turn_on: false
      detailed_loss: false

    EMA:
      enable: true
      decay: 0.999
      start_epoch: 0
      update_every_n_steps: 1
      # Exact resume: keep checkpoint live weights for the optimizer and restore
      # ema_state_dict separately. Do not overwrite live weights with EMA here.
      replace_model_after_load: false
      replace_model_at_end: false

    ProgressiveTraining:
      stages:
        - name: neutrino_only
          epoch_ratio: 1.0
          transition_ratio: 0.0
          loss_weights:
            generation-truth: [1.0, 1.0]

  Dataset:
    dataset_limit: 1.0
    normalization_file: /global/cfs/cdirs/m5019/tihsu/Ztautau/evenet-input/normalization.pt
    val_split: [0.8, 1.0]

  Metrics:
    Generation-Binning:
      neutrino-energy: [121, 0, 60]
      neutrino-pt: [121, 0, 60]
      neutrino-eta: [121, -0.15, 0.15]
      neutrino-phi: [121, -0.05, 0.05]
      neutrino-theta: [121, -0.05, 0.05]
    ObjectTag-Embedding:
      enable: true
      group_name: ObjectTag
      label_feature: Part_pdgId
      max_points: 10000
      max_batches: 10
      log_every_n_epochs: 20
      alpha: 0.8
      marker_size: 8.0
      outlier_percentile_low: 0.5
      outlier_percentile_high: 99.5
      others_label: others
      interested_labels:
        "41": pi
        "2": e
        "6": mu
        "21": gamma
        "42": K
        "47": pi0
        "61": K_S0
        "62": K_L0
        "65": p
        "66": n

network:
  default: evenet_defaults/network-20M.yaml

  Body:
    GroupedSequentialEmbedding:
      hidden_dim_scale: 2.0
      dropout: 0.0

    PET:
      feature_drop: 0.0

  TruthGeneration:
    feature_drop: 0.0

event_info:
  default: generated_event_info.yaml

resonance:
  default: resonance.yaml
