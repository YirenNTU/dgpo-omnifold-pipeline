extends_overlay: train_diffusion_token_film_global.yaml
network:
  VisibleConditioning:
    diffusion_enabled: false
options:
  Training:
    model_checkpoint_save_path: /pscratch/sd/y/yiren/Ztautau/diffusion_token_film_pet_only/checkpoints
logger:
  local:
    name: diffusion-token-film-pet-only
    save_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_token_film_pet_only/logs
  wandb:
    id: difftokpet1
    run_name: "Which conditioning predicts velocity better? | PET Fourier only | matched 50 epochs"
    tags: [DiffusionOnly, NoRL, PETFourierOnly, RawWeights, Data10pct, GPU16, PairedNoise]
nersc:
  ray:
    results_dir: /pscratch/sd/y/yiren/Ztautau/diffusion_token_film_pet_only/ray_results
  execution:
    command: >-
      shifter python3 -u scripts/train_neutrino_backend.py --backend pure-evenet
      --base-config config/train_diffusion_nersc.yaml
      --overlay-config config/train_diffusion_token_film_pet_only.yaml
      -- --ray_dir /pscratch/sd/y/yiren/Ztautau/diffusion_token_film_pet_only/ray_results
experiment:
  intervention: pet_fourier_only_no_generation_film
